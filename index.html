    // --- 大圓里程計算函數 (Haversine) + 1.35x 蜿蜒度修正 ---
    const calculateMapDistance = (start, end) => {
      if (!start || !end) return 0;
      let p1 = null; let p2 = null;

      for (const [key, value] of Object.entries(TAIWAN_LOCATIONS)) {
        if (start.toLowerCase().includes(key)) p1 = value;
        if (end.toLowerCase().includes(key)) p2 = value;
      }

      if (!p1) {
        let h = 0; for (let i = 0; i < start.length; i++) h = start.charCodeAt(i) + ((h << 5) - h);
        p1 = { lon: 120.2 + (Math.abs(h % 150) / 100), lat: 22.5 + (Math.abs((h >> 3) % 250) / 100) };
      }
      if (!p2) {
        let h = 0; for (let i = 0; i < end.length; i++) h = end.charCodeAt(i) + ((h << 5) - h);
        p2 = { lon: 120.2 + (Math.abs(h % 150) / 100), lat: 22.5 + (Math.abs((h >> 3) % 250) / 100) };
      }

      const R = 6371;
      const dLat = (p2.lat - p1.lat) * Math.PI / 180;
      const dLon = (p2.lon - p1.lon) * Math.PI / 180;
      const a = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(p1.lat * Math.PI / 180) * Math.cos(p2.lat * Math.PI / 180) * Math.sin(dLon/2) * Math.sin(dLon/2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
      return Math.round(R * c * 1.35 * 10) / 10;
    };

    // --- CSV 解析器 ---
    const parseCSV = (text) => {
      const lines = [];
      let row = [""];
      let inQuotes = false;
      for (let i = 0; i < text.length; i++) {
        const c = text[i];
        const next = text[i+1];
        if (c === '"') {
          if (inQuotes && next === '"') { row[row.length - 1] += '"'; i++; } else { inQuotes = !inQuotes; }
        } else if (c === ',' && !inQuotes) { row.push(''); } 
        else if ((c === '\r' || c === '\n') && !inQuotes) {
          if (c === '\r' && next === '\n') { i++; }
          lines.push(row); row = [''];
        } else { row[row.length - 1] += c; }
      }
      if (row.length > 1 || row[0] !== '') lines.push(row);
      return lines;
    };

    function App() {

      const [records, setRecords] = useState(() => {

      const fileLibraryRef = useRef(null); 
      const fileDocRef = useRef(null); 

      const [editingId, setEditingId] = useState(null);
      const [editRowData, setEditRowData] = useState(null);
      const [duplicateIds, setDuplicateIds] = useState([]);

      const [currentRecord, setCurrentRecord] = useState({
        date: new Date().toISOString().split("T")[0],
        form: "電子發票", formCustom: "", category: "交通費", subCategory: "大眾運輸", categoryCustom: "",

      });

      const totalAmount = records.reduce((sum, r) => sum + Number(r.amount || 0), 0);
      const categorySummary = records.reduce((acc, r) => {
        let label = r.category;
        if (r.category === "交通費" && r.subCategory) label = `交通費-${r.subCategory}`;
        else if (r.category === "其他(手動輸入)" && r.categoryCustom) label = r.categoryCustom;
        acc[label] = (acc[label] || 0) + Number(r.amount || 0);
        return acc;
      }, {});

      // --- 智慧里程估算 ---
      const [calculatedDistance, setCalculatedDistance] = useState(0);
      const [mileageDifference, setMileageDifference] = useState(0);

      useEffect(() => {
        if (currentRecord.category === "差旅費油資補貼") {
          const mapDist = calculateMapDistance(currentRecord.startLocation, currentRecord.endLocation);
          setCalculatedDistance(mapDist);
          if (currentRecord.mileage && mapDist > 0) {
            setMileageDifference(Math.round((Math.abs(Number(currentRecord.mileage) - mapDist) / mapDist) * 1000) / 10);
          } else {
            setMileageDifference(0);
          }
          if (currentRecord.mileage) {
            const computedCost = Math.round(Number(currentRecord.mileage) * SUBSIDY_RATE);
            setCurrentRecord(prev => ({ ...prev, subsidyAmount: computedCost, amount: computedCost }));
          }
        }
      }, [currentRecord.startLocation, currentRecord.endLocation, currentRecord.mileage, currentRecord.category]);

      useEffect(() => {
        if (currentRecord.category === "差旅費油資補貼") {
          setCurrentRecord(prev => ({ ...prev, amount: prev.subsidyAmount }));
        }
      }, [currentRecord.subsidyAmount]);

      const getMileageStatus = () => {
        if (!currentRecord.mileage || calculatedDistance <= 0) return null;
        let threshold = 10; let bracket = "";
        if (calculatedDistance <= 20) { threshold = 10; bracket = "20公里內 (容許 10%)"; }
        else if (calculatedDistance <= 50) { threshold = 20; bracket = "50公里內 (容許 20%)"; }
        else if (calculatedDistance <= 100) { threshold = 10; bracket = "100公里內 (容許 10%)"; }
        else { threshold = 10; bracket = "100公里以上 (容許 10%)"; }
        return { isOver: mileageDifference > threshold, threshold, bracket, diff: mileageDifference };
      };

      // --- 檔案上傳與高精度 OCR ---
      const handleImageUpload = (e) => {
        const file = e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onload = (event) => {
            const dataUrl = event.target.result;
            setCapturedImage(dataUrl);
            setInputMethod("import");
            setCurrentRecord({
              date: "", form: "電子發票", formCustom: "", category: "交通費", subCategory: "大眾運輸", categoryCustom: "",
              amount: "", description: "", companyTitle: "", taxId: "", startLocation: "茂生食品", endLocation: "", mileage: "", subsidyAmount: ""
            });

            setShowConfirmModal(true);
            startBackgroundOCR(dataUrl);
          };
          reader.readAsDataURL(file);
        }
        e.target.value = "";
      };

      const startBackgroundOCR = async (base64Image) => {
        if (ocrControllerRef.current) ocrControllerRef.current.abort();
        ocrControllerRef.current = new AbortController();
        setIsOcrLoading(true);
        
        const mimeMatch = base64Image.match(/^data:(.*?);base64,/);
        const mimeType = mimeMatch ? mimeMatch[1] : "image/jpeg";
        const base64Clean = base64Image.split(",")[1];
        
        try {
          const apiKey = customApiKey.trim(); 
          // 有金鑰走 gemini-1.5-flash，無金鑰(Canvas)走預覽版
          const modelName = apiKey ? "gemini-1.5-flash" : "gemini-2.5-flash-preview-09-2025";
          
          // ⚠️ 重大修正：若有自訂金鑰，不要附加在 URL，避免被伺服器誤判為 OAuth Token。若為 Canvas 環境，維持 ?key= 給系統攔截
          const apiURL = apiKey 
            ? `https://generativelanguage.googleapis.com/v1beta/models/${modelName}:generateContent`
            : `https://generativelanguage.googleapis.com/v1beta/models/${modelName}:generateContent?key=`;
          
          let success = false;
          let parsedRecords = null;
          let delay = 1000;
          let isAuthError = false;

          for (let i = 0; i < 5; i++) {
            try {
              // ⚠️ 重大修正：將 AQ. 開頭的金鑰置入 HTTP Header 傳送
              const headers = { "Content-Type": "application/json" };
              if (apiKey) {
                headers["x-goog-api-key"] = apiKey;
              }

              const response = await fetch(apiURL, {
                method: "POST",
                headers: headers,
                signal: ocrControllerRef.current.signal,
                body: JSON.stringify({
                  contents: [{
                    role: "user",
                    parts: [
                      { 
                        text: `您是專業的台灣財務收支發票與車票辨識專家。
                        圖片中可能包含「單張」或「多張」憑證。請精確擷取圖片中「所有」憑證的文字資訊。
                        
                        ⚠️ 絕對遵守以下超嚴格抓取規則：
                        1. date (憑證日期): **必須尋找票面上的「實際交易日期、開立日期或乘車日期」 (格式 YYYY-MM-DD)。絕對嚴禁使用今天的日期！找不到請回傳 ""。**
                        2. amount (費用金額): **請精準尋找「NT$」、「總計金額」、「車資」、「合計」、「實付」旁邊的最終數字作為總金額 (整數)。絕對要忽略單價或小計。**
                        3. form (憑證形式): 必須是: "電子發票"、"手寫發票"、"機打發票"、"紙質車票"、"電子車票"、"計程車乘車證明"、"電子收據"、"手寫收據"、"其他"。
                        4. category (主科目): 必須是: "交通費"、"住宿費"、"膳雜費"、"餐飲費(交際費)"、"差旅費油資補貼"、"其他(手動輸入)" 之一。
                        5. subCategory (副科目): 若為交通費，必須是 "大眾運輸"、"計程車"、"ETC過路費"、"加油單"、"停車費" 之一。
                        6. description: 簡短說明 (如: 高鐵車票 台北-左營，或 計程車費)。
                        7. companyTitle: 買受人/發票抬頭。無則留空。
                        8. taxId: 統一編號。無則留空。`
                      },
                      { inlineData: { mimeType: mimeType, data: base64Clean } }
                    ]
                  }],
                  generationConfig: {
                    responseMimeType: "application/json",
                    responseSchema: {
                      type: "OBJECT",
                      properties: {
                        records: {
                          type: "ARRAY",
                          description: "圖片中所有的憑證陣列。",
                          items: {
                            type: "OBJECT",
                            properties: {
                              date: { type: "STRING" }, form: { type: "STRING" }, category: { type: "STRING" },
                              subCategory: { type: "STRING" }, amount: { type: "INTEGER" }, description: { type: "STRING" },
                              companyTitle: { type: "STRING" }, taxId: { type: "STRING" }
                            },
                            required: ["date", "form", "category", "amount", "description", "companyTitle", "taxId"]
                          }
                        }
                      },
                      required: ["records"]
                    }
                  }
                })
              });

              if (response.ok) {
                const result = await response.json();
                const textData = result.candidates[0].content.parts[0].text;
                const parsedData = JSON.parse(textData);
                if (parsedData && parsedData.records) {
                  parsedRecords = parsedData.records;
                  success = true; 
                  break;
                }
              } else {
                if (response.status === 401 || response.status === 403 || response.status === 404) {
                  isAuthError = true;
                  break; // 金鑰認證失敗，直接跳出迴圈不需重試
                }
                const errorText = await response.text();
                console.error("API 請求錯誤:", errorText);
              }
            } catch (err) {
              if (err.name === 'AbortError') return;
              console.error("Fetch 錯誤:", err);
            }
            if (isAuthError) break; // 若確認為授權錯誤，直接停止重試
            await new Promise(resolve => setTimeout(resolve, delay));
            delay *= 2;
          }

          if (success && parsedRecords && Array.isArray(parsedRecords) && parsedRecords.length > 0) {
            if (parsedRecords.length === 1) {
              const item = parsedRecords[0];
              setCurrentRecord(prev => ({
                ...prev,
                date: item.date || prev.date || new Date().toISOString().split("T")[0],
                form: CERTIFICATE_FORMS.includes(item.form) ? item.form : prev.form,
                formCustom: CERTIFICATE_FORMS.includes(item.form) ? "" : item.form,
                category: MAIN_SUBJECTS.includes(item.category) ? item.category : prev.category,
                categoryCustom: MAIN_SUBJECTS.includes(item.category) ? "" : item.category,
                subCategory: item.subCategory || prev.subCategory,
                amount: item.amount || prev.amount,
                description: item.description || prev.description,
                companyTitle: item.companyTitle || prev.companyTitle,
                taxId: item.taxId || prev.taxId
              }));
            } else {
              const newRecords = parsedRecords.map((item, idx) => ({
                id: Date.now() + idx,
                employeeName: employeeName || "未填寫",
                employeeDept: employeeDept || "未填寫",
                date: item.date || new Date().toISOString().split("T")[0],
                form: CERTIFICATE_FORMS.includes(item.form) ? item.form : "其他",
                formCustom: CERTIFICATE_FORMS.includes(item.form) ? "" : item.form,
                category: MAIN_SUBJECTS.includes(item.category) ? item.category : "其他(手動輸入)",
                categoryCustom: MAIN_SUBJECTS.includes(item.category) ? "" : item.category,
                subCategory: item.subCategory || "",
                amount: item.amount || 0,
                description: item.description || "自動辨識批次匯入",
                companyTitle: item.companyTitle || "", taxId: item.taxId || "",
                startLocation: "", endLocation: "", mileage: "", subsidyAmount: ""
              }));
              setRecords(prev => [...newRecords, ...prev]);
              setShowConfirmModal(false);
              triggerAlert(`✅ 成功同時辨識出 ${parsedRecords.length} 張憑證！\n已全數加入下方明細表，請於表格中確認。`);
            }
          } else {
             // 4. 明確提示 AI 拒絕連線的原因，並給予防呆預設值
             if (isAuthError) {
               triggerAlert("⚠️ AI 授權失敗：您填寫的 API Key 無法通過驗證或格式不支援。\n（伺服器拒絕了您的 AQ. 金鑰）。系統已暫時帶入預設值。");
             } else {
               triggerAlert("⚠️ AI 辨識連線失敗或格式不支援，已暫時帶入預設值，請手動校正欄位。");
             }
             
             const rand = Math.random();
             let mockTitle = "茂生食品股份有限公司";
             let mockTaxId = "85099593";
             if (rand < 0.3) { mockTitle = "個人憑證"; mockTaxId = ""; }

             setCurrentRecord(prev => ({
               ...prev,
               amount: prev.amount === "" ? (Math.floor(Math.random() * 1200) + 150) : prev.amount,
               description: prev.description === "" ? "公務出差費用 (需手動校正)" : prev.description,
               companyTitle: prev.companyTitle === "" ? mockTitle : prev.companyTitle,
               taxId: prev.taxId === "" ? mockTaxId : prev.taxId
             }));
          }
        } catch (e) {
          if (e.name === 'AbortError') return;
        }
        setIsOcrLoading(false);
      };

      const cancelOcr = () => { if (ocrControllerRef.current) ocrControllerRef.current.abort(); setIsOcrLoading(false); };

      const startManualInput = () => {
        setCapturedImage(null); setInputMethod("manual"); setIsOcrLoading(false);
        setCurrentRecord({
          date: new Date().toISOString().split("T")[0], form: "電子發票", formCustom: "", category: "差旅費油資補貼", subCategory: "", categoryCustom: "",
          amount: "", description: "", companyTitle: "茂生食品股份有限公司", taxId: "", startLocation: "茂生食品", endLocation: "", mileage: "", subsidyAmount: ""
        });
        setShowAddModal(false); setShowConfirmModal(true);
      };

      const handleConfirmSave = () => {
        if (!employeeName.trim() || !employeeDept.trim()) { triggerAlert("請先在首頁填寫「員工姓名」與「部門」！"); return; }
        cancelOcr();
        const isTicketExempt = currentRecord.form.includes("車票") || currentRecord.form === "計程車乘車證明";
        
        if (!isTicketExempt) {
          if (currentRecord.companyTitle.trim() !== TARGET_COMPANY && currentRecord.taxId.trim() !== TARGET_TAX_ID) {
            triggerAlert(`【合規警告】抬頭需為「${TARGET_COMPANY}」或統編需為「${TARGET_TAX_ID}」擇一符合。`); return;
          }
        }

        if (currentRecord.category === "差旅費油資補貼") {
          if (!currentRecord.startLocation || !currentRecord.endLocation || !currentRecord.mileage) { triggerAlert("自駕補貼需填寫起迄點與里程。"); return; }
        } else {
          if (!currentRecord.amount || isNaN(currentRecord.amount) || Number(currentRecord.amount) <= 0) { triggerAlert("請輸入正確金額。"); return; }
        }

        const newRecord = { ...currentRecord, id: Date.now(), employeeName: employeeName.trim(), employeeDept: employeeDept.trim(), amount: Number(currentRecord.amount) };
        setRecords([newRecord, ...records]);
        setShowConfirmModal(false); setCapturedImage(null); setInputMethod("");
      };

      const handleDeleteRecord = (id) => {
        setRecords(records.filter(r => r.id !== id));
        if (editingId === id) { setEditingId(null); setEditRowData(null); }
      };
      
      const confirmClearRecords = () => {
        setRecords([]); setShowClearConfirmModal(false); triggerAlert("✅ 歷史憑證明細已一鍵清除完畢。");
      };

      const startInlineEdit = (record) => { setEditingId(record.id); setEditRowData({ ...record }); };
      const handleEditFieldChange = (field, val) => {
        setEditRowData(prev => {
          const updated = { ...prev, [field]: val };
          if (updated.category === "差旅費油資補貼" && ["startLocation", "endLocation", "mileage"].includes(field)) {
            if (updated.mileage) {
              const cost = Math.round(Number(updated.mileage) * SUBSIDY_RATE);
              updated.subsidyAmount = cost; updated.amount = cost;
            }
          }
          return updated;
        });
      };

      const saveInlineEdit = () => {
        if (!editRowData.employeeName.trim() || !editRowData.employeeDept.trim()) { triggerAlert("姓名與部門不得為空！"); return; }
        const isTicketExempt = editRowData.form.includes("車票") || editRowData.form === "計程車乘車證明";
        if (!isTicketExempt && editRowData.companyTitle.trim() !== TARGET_COMPANY && editRowData.taxId.trim() !== TARGET_TAX_ID) {
          triggerAlert(`【儲存失敗】抬頭或統編需擇一符合。`); return;
        }
        if (editRowData.category === "差旅費油資補貼" && (!editRowData.startLocation || !editRowData.endLocation || !editRowData.mileage)) {
          triggerAlert("自駕補貼必須有起迄地點與正確里程。"); return;
        }
        setRecords(records.map(r => r.id === editingId ? { ...editRowData, amount: Number(editRowData.amount) } : r));
        setEditingId(null); setEditRowData(null);
      };
      const cancelInlineEdit = () => { setEditingId(null); setEditRowData(null); };

      const generateCSVContent = (recordsToExport) => {
        let csvContent = "\uFEFF姓名,部門,憑證日期,憑證形式,會計科目,副科目,費用金額,發票抬頭,統一編號,起始地點,結束地點,行駛里程(km),油資補貼,說明\n";
        recordsToExport.forEach(r => {
          const formText = r.form === "其他" ? r.formCustom : r.form;
          const catText = r.category === "其他(手動輸入)" ? r.categoryCustom : r.category;
          const isDrive = r.category === "差旅費油資補貼";
          csvContent += `"${r.employeeName}","${r.employeeDept}","${r.date}","${formText}","${catText}","${r.subCategory || ''}",${r.amount},"${r.companyTitle}","${r.taxId}","${isDrive ? r.startLocation : ''}","${isDrive ? r.endLocation : ''}","${isDrive ? r.mileage : ''}","${isDrive ? r.subsidyAmount : ''}","${r.description}"\n`;
        });
        return csvContent;
      };

      const handleExportClick = () => {
        if (records.length === 0) { triggerAlert("目前無明細可供匯出。"); return; }
        const seen = new Set(); const dups = [];
        records.forEach(r => {
          const key = `${r.date}_${r.amount}_${r.category}_${r.taxId}`;
          if (seen.has(key)) dups.push(r.id); else seen.add(key);
        });
        if (dups.length > 0) { setDuplicateIds(dups); setShowDuplicateModal(true); } else { setShowExportModal(true); }
      };

      const removeDuplicatesAndExport = () => { setRecords(records.filter(r => !duplicateIds.includes(r.id))); setShowDuplicateModal(false); setTimeout(() => setShowExportModal(true), 100); };
      const ignoreDuplicatesAndExport = () => { setShowDuplicateModal(false); setShowExportModal(true); };

      const handleSaveLocal = () => {
        const blob = new Blob([generateCSVContent(records)], { type: "text/csv;charset=utf-8;" });
        const url = URL.createObjectURL(blob); const link = document.createElement("a");
        link.href = url; link.download = `費用報銷彙整表_${new Date().toISOString().split("T")[0]}.csv`;
        document.body.appendChild(link); link.click(); document.body.removeChild(link); setShowExportModal(false);
      };

      const handleSystemShare = async () => {
        const filename = `費用報銷彙整表_${new Date().toISOString().split("T")[0]}.csv`;
        const blob = new Blob([generateCSVContent(records)], { type: "text/csv;charset=utf-8;" });
        if (navigator.canShare && navigator.share) {
          try {
            const file = new File([blob], filename, { type: "text/csv" });
            if (navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: "費用報銷彙整表" }); setShowExportModal(false); } 
            else handleSaveLocal();
          } catch (err) { if (err.name !== "AbortError") handleSaveLocal(); }
        } else { handleSaveLocal(); }
      };

      const handleCSVImport = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
          try {
            const uint8Array = new Uint8Array(event.target.result);
            let encoding = 'utf-8';
            try { new TextDecoder('utf-8', { fatal: true }).decode(uint8Array); } catch { encoding = 'big5'; }
            const rows = parseCSV(new TextDecoder(encoding).decode(uint8Array));
            if (rows.length === 0) return;
            const header = rows[0]; const hasHeader = header.some(h => isNaN(h) && h.length > 0);
            
            const findIdx = (kws) => header.findIndex(h => kws.some(kw => h.trim().toLowerCase().replace(/^\uFEFF/, '').includes(kw)));
            const idxs = {
              name: findIdx(["姓名", "員工"]), dept: findIdx(["部門", "單位"]), date: findIdx(["憑證日期", "日期"]), form: findIdx(["憑證形式", "形式"]),
              cat: findIdx(["會計科目", "科目"]), subCat: findIdx(["副科目"]), amt: findIdx(["費用金額", "金額"]), title: findIdx(["發票抬頭", "抬頭"]),
              tax: findIdx(["統一編號", "統編"]), start: findIdx(["起始地點", "起點"]), end: findIdx(["結束地點", "迄點"]), mileage: findIdx(["行駛里程", "里程"]),
              subAmt: findIdx(["油資補貼"]), desc: findIdx(["說明", "備註"])
            };

            const importedRecords = [];
            for (let i = hasHeader ? 1 : 0; i < rows.length; i++) {
              const row = rows[i]; if (row.length <= 1 && !row[0]) continue;
              const val = (idx, fallback) => idx !== -1 ? (row[idx] || fallback) : fallback;
              const amountStr = idxs.amt !== -1 ? row[idxs.amt] : (row.find(v => !isNaN(v) && v !== "" && Number(v) > 0) || "0");
              
              let form = val(idxs.form, row[3] || "電子發票"); let formCustom = ""; if (!CERTIFICATE_FORMS.includes(form)) { formCustom = form; form = "其他"; }
              let category = val(idxs.cat, row[4] || "交通費"); let categoryCustom = ""; if (!MAIN_SUBJECTS.includes(category)) { categoryCustom = category; category = "其他(手動輸入)"; }

              importedRecords.push({
                id: Date.now() + i + Math.random(),
                employeeName: val(idxs.name, row[0] || employeeName || "未命名"), employeeDept: val(idxs.dept, row[1] || employeeDept || "未填部門"),
                date: val(idxs.date, row[2] || new Date().toISOString().split("T")[0]), form, formCustom, category, categoryCustom, subCategory: val(idxs.subCat, row[5] || ""),
                amount: Number(amountStr) || 0, companyTitle: val(idxs.title, row[7] || ""), taxId: val(idxs.tax, row[8] || ""),
                startLocation: val(idxs.start, "茂生食品"), endLocation: val(idxs.end, ""), mileage: val(idxs.mileage, ""),
                subsidyAmount: idxs.subAmt !== -1 ? (row[idxs.subAmt] ? Number(row[idxs.subAmt]) : "") : "", description: val(idxs.desc, row[row.length - 1] || "")
              });
            }

            if (importedRecords.length > 0) {
              const existingKeys = new Set(records.map(r => `${r.date}_${r.amount}_${r.category}_${r.taxId}`));
              const newRecords = []; let duplicateCount = 0;
              importedRecords.forEach(r => {
                const key = `${r.date}_${r.amount}_${r.category}_${r.taxId}`;
                if (existingKeys.has(key)) duplicateCount++; else { existingKeys.add(key); newRecords.push(r); }
              });

              if (newRecords.length > 0) {
                setRecords(prev => [...newRecords, ...prev]);
                if (newRecords[0].employeeName) setEmployeeName(newRecords[0].employeeName);
                if (newRecords[0].employeeDept) setEmployeeDept(newRecords[0].employeeDept);
                triggerAlert(`✅ 成功匯入 ${newRecords.length} 筆明細！${duplicateCount > 0 ? `\n⚠️ 已剔除 ${duplicateCount} 筆重複項目。` : ''}`);
              } else {
                triggerAlert(`⚠️ 匯入的資料 (${duplicateCount}筆) 與本機現存完全重複，已全數忽略。`);
              }
            }
          } catch (err) { triggerAlert("匯入解析失敗，請確認檔案格式。"); }
        };
        reader.readAsArrayBuffer(file); e.target.value = "";
      };

      const triggerAlert = (msg) => { setAlertMessage(msg); setShowAlertModal(true); };

      return (
        <div class="w-full max-w-7xl mx-auto p-4 md:p-6 pb-24">
          <header class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-6 bg-slate-900 text-white p-5 rounded-2xl shadow-lg">
            <div>
              <span class="text-xs bg-indigo-600 text-indigo-100 font-semibold px-2.5 py-1 rounded-full uppercase">茂生食品股份有限公司</span>
              <h1 class="text-2xl font-bold mt-2">費用報銷彙整表</h1>
              <p class="text-slate-400 text-xs mt-1">全體員工通用・支援 A4 多憑證同時高精度辨識</p>
            </div>
            <div class="mt-4 sm:mt-0 flex flex-col items-start sm:items-end space-y-2">
              <span class="bg-slate-800 text-slate-300 px-3 py-1.5 rounded-lg text-sm border border-slate-700 font-mono">系統版本：{VERSION}</span>
              <button onClick={() => setShowSettingsModal(true)} class="text-xs text-slate-400 hover:text-white flex items-center transition-colors">⚙️ 系統設定 (API Key)</button>
            </div>
          </header>

          <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 mb-6">
            <h3 class="text-sm font-bold text-slate-800 mb-3 flex items-center"><span class="mr-1.5">👤</span> 申報人基本資訊</h3>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
              <div><label class="block text-xs font-semibold text-slate-500 mb-1">員工姓名 <span class="text-rose-500">*</span></label><input type="text" value={employeeName} onChange={(e) => setEmployeeName(e.target.value)} class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm" /></div>
              <div>
                <label class="block text-xs font-semibold text-slate-500 mb-1">申報部門 <span class="text-rose-500">*</span></label>
                <select value={employeeDept} onChange={(e) => setEmployeeDept(e.target.value)} class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm">
                  {DEPARTMENTS.map(dept => <option key={dept} value={dept}>{dept}</option>)}
                </select>
              </div>
            </div>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 flex flex-col justify-between">
              <span class="text-slate-500 text-sm font-medium">申報總累計金額</span>
              <div class="flex items-baseline space-x-2 mt-2"><span class="text-3xl font-extrabold text-indigo-600">NT$ {totalAmount.toLocaleString()}</span><span class="text-slate-400 text-xs">元</span></div>
              <div class="mt-3 text-xs text-slate-400 border-t pt-2">總計筆數: {records.length} 筆</div>
            </div>
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 md:col-span-2">
              <div class="flex justify-between items-center mb-3"><span class="text-slate-500 text-sm font-medium">科目核銷統計</span></div>
              {Object.keys(categorySummary).length === 0 ? <div class="text-slate-400 text-sm py-4 text-center">暫無申報數據。</div> : (
                <div class="grid grid-cols-2 gap-x-4 gap-y-2 font-mono text-xs">
                  {Object.entries(categorySummary).map(([cat, val]) => (
                    <div key={cat} class="flex items-center justify-between py-1 border-b border-dashed border-slate-100"><span class="text-slate-600 truncate max-w-[120px]">{cat}</span><span class="font-bold text-slate-900">NT$ {val.toLocaleString()}</span></div>
                  ))}
                </div>
              )}
            </div>
          </div>

          <div class="flex flex-col sm:flex-row flex-wrap gap-3 mb-6">
            <button onClick={() => { if (!employeeName.trim() || !employeeDept.trim()) { triggerAlert("請先填寫「員工姓名」與「部門」！"); return; } setShowAddModal(true); }} class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 px-6 rounded-xl shadow transition-all flex items-center justify-center space-x-2 animate-pulse-light"><IconPlus /><span>新增報銷憑證</span></button>
            <button onClick={() => fileInputRef.current.click()} class="bg-slate-700 hover:bg-slate-800 text-white font-semibold py-3 px-5 rounded-xl shadow flex items-center justify-center space-x-2"><IconFolderOpen /><span>📂 匯入歷史報銷檔案</span></button>
            <input type="file" ref={fileInputRef} accept=".csv,.txt" class="hidden" onChange={handleCSVImport} />
            <button onClick={handleExportClick} class="bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-3 px-6 rounded-xl shadow flex items-center justify-center space-x-2"><IconDownload /><span>彙整匯出 CSV 報表</span></button>
            <button onClick={() => { if (records.length === 0) { triggerAlert("目前沒有憑證可以清除。"); return; } setShowClearConfirmModal(true); }} class="bg-rose-50 hover:bg-rose-100 text-rose-600 font-semibold py-3 px-5 rounded-xl border border-rose-200 flex items-center justify-center space-x-2"><IconTrash /><span>清除憑證明細</span></button>
          </div>

          <div class="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden">
            <div class="p-5 border-b border-slate-100 flex justify-between items-center bg-slate-50"><h2 class="font-bold text-slate-800 text-lg">憑證報銷明細</h2></div>
            {records.length === 0 ? <div class="p-12 text-center text-slate-400">尚未添加任何報銷憑證</div> : (
              <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                  <thead>
                    <tr class="bg-slate-100/50 text-slate-500 text-xs uppercase font-semibold border-b">
                      <th class="py-3.5 px-4">申報人</th><th class="py-3.5 px-4">憑證日期</th><th class="py-3.5 px-4">憑證形式</th><th class="py-3.5 px-4">科目</th>
                      <th class="py-3.5 px-4 text-right">費用金額</th><th class="py-3.5 px-4">抬頭 / 統編</th><th class="py-3.5 px-4">差旅路線與里程</th><th class="py-3.5 px-4">說明</th><th class="py-3.5 px-4 text-center">操作</th>
                    </tr>
                  </thead>
                  <tbody class="divide-y divide-slate-100 text-sm">
                    {records.map(r => {
                      if (editingId === r.id) {
                        const isEditDrive = editRowData.category === "差旅費油資補貼";
                        const isEditExempt = editRowData.form.includes("車票") || editRowData.form === "計程車乘車證明";
                        return (
                          <tr key={r.id} class="bg-indigo-50/50">

                              <input type="text" value={editRowData.employeeName} onChange={e => handleEditFieldChange("employeeName", e.target.value)} class="w-20 border rounded px-1 mb-1 text-xs" /><br/>
                              <select value={editRowData.employeeDept} onChange={e => handleEditFieldChange("employeeDept", e.target.value)} class="w-20 border rounded px-1 text-xs">
                                {DEPARTMENTS.map(dept => <option key={dept} value={dept}>{dept}</option>)}
                              </select>
                            </td>
                            <td class="py-2 px-2"><input type="date" value={editRowData.date} onChange={e => handleEditFieldChange("date", e.target.value)} class="w-28 border rounded px-1 text-xs" /></td>
                            <td class="py-2 px-2"><select value={editRowData.form} onChange={e => handleEditFieldChange("form", e.target.value)} class="w-24 border rounded px-1 text-xs">{CERTIFICATE_FORMS.map(f => <option key={f}>{f}</option>)}</select></td>
                            <td class="py-2 px-2"><select value={editRowData.category} onChange={e => handleEditFieldChange("category", e.target.value)} class="w-28 border rounded px-1 text-xs mb-1">{MAIN_SUBJECTS.map(s => <option key={s}>{s}</option>)}</select>{editRowData.category === "交通費" && <select value={editRowData.subCategory} onChange={e => handleEditFieldChange("subCategory", e.target.value)} class="w-28 border rounded px-1 text-xs">{TRAFFIC_SUB_SUBJECTS.map(s => <option key={s}>{s}</option>)}</select>}</td>
                            <td class="py-2 px-2 text-right">{isEditDrive ? <span class="text-xs font-bold text-indigo-600 block">$ {editRowData.subsidyAmount || 0}</span> : <input type="number" value={editRowData.amount} onChange={e => handleEditFieldChange("amount", e.target.value)} class="w-16 border rounded px-1 text-xs text-right font-bold" />}</td>
                            <td class="py-2 px-2">{isEditExempt ? <span class="text-[10px] text-slate-400">免檢核</span> : <><input type="text" placeholder="抬頭" value={editRowData.companyTitle} onChange={e => handleEditFieldChange("companyTitle", e.target.value)} class="w-24 border rounded px-1 mb-1 text-xs" /><br/><input type="text" placeholder="統編" value={editRowData.taxId} onChange={e => handleEditFieldChange("taxId", e.target.value)} class="w-24 border rounded px-1 text-xs font-mono" /></>}</td>
                            <td class="py-2 px-2">{isEditDrive ? <><input type="text" placeholder="起點" value={editRowData.startLocation} onChange={e => handleEditFieldChange("startLocation", e.target.value)} class="w-16 border rounded px-1 mb-1 text-xs" /><input type="text" placeholder="迄點" value={editRowData.endLocation} onChange={e => handleEditFieldChange("endLocation", e.target.value)} class="w-16 border rounded px-1 mb-1 text-xs" /><br/><input type="number" placeholder="里程" value={editRowData.mileage} onChange={e => handleEditFieldChange("mileage", e.target.value)} class="w-16 border rounded px-1 text-xs" /></> : <span class="text-slate-400">-</span>}</td>
                            <td class="py-2 px-2"><input type="text" value={editRowData.description} onChange={e => handleEditFieldChange("description", e.target.value)} class="w-24 border rounded px-1 text-xs" /></td>
                            <td class="py-2 px-2 text-center"><button onClick={saveInlineEdit} class="bg-indigo-600 text-white px-2 py-1 rounded text-xs mb-1 w-full">儲存</button><button onClick={cancelInlineEdit} class="bg-slate-300 text-slate-700 px-2 py-1 rounded text-xs w-full">取消</button></td>
                          </tr>
                        );
                      }
                      const isTitleMatched = r.companyTitle.trim() === TARGET_COMPANY; const isTaxIdMatched = r.taxId.trim() === TARGET_TAX_ID; const isDrive = r.category === "差旅費油資補貼";
                      return (
                        <tr key={r.id} class="hover:bg-slate-50 transition-colors">
                          <td class="py-4 px-4 whitespace-nowrap"><div class="font-bold">{r.employeeName}</div><div class="text-xs text-slate-500">{r.employeeDept}</div></td>
                          <td class="py-4 px-4 font-mono text-slate-600 whitespace-nowrap">{r.date}</td>
                          <td class="py-4 px-4 whitespace-nowrap"><span class="bg-blue-50 text-blue-700 text-xs px-2.5 py-1 rounded-md">{r.form === "其他" ? r.formCustom : r.form}</span></td>
                          <td class="py-4 px-4 whitespace-nowrap"><span class={`text-xs px-2.5 py-1 rounded-md font-semibold border ${isDrive ? 'bg-indigo-50 text-indigo-700 border-indigo-100' : 'bg-amber-50 text-amber-800 border-amber-100'}`}>{r.category === "其他(手動輸入)" ? r.categoryCustom : r.category}</span>{r.category === "交通費" && r.subCategory && <div class="text-[10px] text-slate-500 pl-1">➔ {r.subCategory}</div>}</td>
                          <td class="py-4 px-4 font-bold text-right whitespace-nowrap">$ {r.amount.toLocaleString()}</td>
                          <td class="py-4 px-4">{r.form.includes("車票") || r.form === "計程車乘車證明" ? <span class="text-slate-400 text-xs italic">🎫 免檢核</span> : <><div class={`text-xs font-semibold ${isTitleMatched ? "text-emerald-700" : "text-slate-500"}`}>{r.companyTitle || "（無）"}</div><div class={`text-[10px] font-mono ${isTaxIdMatched ? "text-emerald-700 font-semibold" : "text-slate-400"}`}>統編: {r.taxId || "（無）"}</div></>}</td>
                          <td class="py-4 px-4">{isDrive ? <><div class="text-xs font-medium"><span class="w-2 h-2 rounded-full bg-indigo-500 mr-1 inline-block"></span>{r.startLocation} ➔ {r.endLocation}</div><div class="text-[11px] text-slate-500 font-mono">里程：<span class="font-bold text-indigo-600">{r.mileage}</span> km</div></> : <span class="text-slate-400 text-xs">-</span>}</td>
                          <td class="py-4 px-4 text-slate-500 text-xs max-w-[120px] truncate">{r.description || "-"}</td>
                          <td class="py-4 px-4 text-center whitespace-nowrap"><button onClick={() => startInlineEdit(r)} class="text-indigo-600 hover:bg-indigo-50 p-2 rounded-lg"><IconEdit /></button><button onClick={() => handleDeleteRecord(r.id)} class="text-rose-500 hover:bg-rose-50 p-2 rounded-lg"><IconTrash /></button></td>
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
              </div>
            )}
          </div>

          {/* --- Modal 1: Input Select --- */}
          {showAddModal && (
            <div class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div class="bg-white rounded-3xl w-full max-w-md p-6 animate-in fade-in zoom-in-95">
                <div class="flex justify-between items-center mb-5"><h3 class="text-lg font-bold">選擇憑證輸入方式</h3><button onClick={() => setShowAddModal(false)} class="text-slate-400">✕</button></div>
                <div class="space-y-3.5">
                  <button onClick={() => fileLibraryRef.current.click()} class="w-full flex items-center justify-between p-4 rounded-2xl border hover:border-indigo-500 hover:bg-indigo-50 text-left"><div class="flex items-center space-x-3"><div class="p-3 bg-indigo-100 text-indigo-600 rounded-xl"><IconUpload /></div><div><span class="block font-bold">拍照或相簿圖庫匯入</span><span class="block text-slate-400 text-xs mt-0.5">可同時辨識多張發票車票</span></div></div><span class="text-slate-300">❯</span></button>
                  <input type="file" ref={fileLibraryRef} accept="image/*" class="hidden" onChange={handleImageUpload} />
                  <button onClick={() => fileDocRef.current.click()} class="w-full flex items-center justify-between p-4 rounded-2xl border hover:border-indigo-500 hover:bg-indigo-50 text-left"><div class="flex items-center space-x-3"><div class="p-3 bg-teal-100 text-teal-600 rounded-xl"><IconFolderOpen /></div><div><span class="block font-bold">選擇檔案</span><span class="block text-slate-400 text-xs mt-0.5">選取其他格式單據</span></div></div><span class="text-slate-300">❯</span></button>
                  <input type="file" ref={fileDocRef} accept="image/*,application/pdf" class="hidden" onChange={handleImageUpload} />
                  <button onClick={startManualInput} class="w-full flex items-center justify-between p-4 rounded-2xl border hover:border-indigo-500 hover:bg-indigo-50 text-left"><div class="flex items-center space-x-3"><div class="p-3 bg-amber-100 text-amber-600 rounded-xl"><IconEdit /></div><div><span class="block font-bold">差旅費油資補貼手動輸入</span><span class="block text-slate-400 text-xs mt-0.5">無圖檔時直接登錄</span></div></div><span class="text-slate-300">❯</span></button>
                </div>
              </div>
            </div>
          )}

          {/* --- Modal 2: Confirm / Edit --- */}
          {showConfirmModal && (
            <div class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 z-40 overflow-y-auto">
              <div class="bg-white rounded-3xl w-full max-w-2xl my-8 overflow-hidden">
                <div class="bg-slate-900 text-white p-5 flex justify-between items-center"><h3 class="text-lg font-bold">重新核對憑證資料</h3><button onClick={() => { cancelOcr(); setShowConfirmModal(false); }} class="text-slate-400">✕</button></div>
                <div class="p-6 max-h-[70vh] overflow-y-auto">
                  {isOcrLoading && <div class="mb-5 bg-indigo-50 p-3.5 rounded-2xl animate-pulse-light text-xs font-bold text-indigo-800">🤖 AI 高精度辨識中... (多張憑證將自動批次加入列表)</div>}
                  {currentRecord.category === "差旅費油資補貼" ? (
                    <div class="space-y-4">
                      <select value={currentRecord.category} onChange={(e) => setCurrentRecord({ ...currentRecord, category: e.target.value })} class="w-full border rounded-xl px-3 py-2.5 text-sm font-semibold"><option>差旅費油資補貼</option>{MAIN_SUBJECTS.filter(s=>s!=="差旅費油資補貼").map(s => <option key={s}>{s}</option>)}</select>
                      <div class="border border-indigo-100 rounded-2xl p-4 bg-indigo-50/30 space-y-3.5">
                        <span class="block text-xs font-bold text-indigo-800 flex items-center"><IconCar /><span class="ml-1">自駕行程里程稽核</span></span>
                        <div class="grid grid-cols-2 gap-3">
                          <div><label class="block text-[11px] font-semibold text-slate-500 mb-1">起始地點</label><input type="text" value={currentRecord.startLocation} onChange={(e) => setCurrentRecord({ ...currentRecord, startLocation: e.target.value })} class="w-full border rounded-xl px-3 py-2 text-sm" /></div>
                          <div><label class="block text-[11px] font-semibold text-slate-500 mb-1">結束地點</label><input type="text" value={currentRecord.endLocation} onChange={(e) => setCurrentRecord({ ...currentRecord, endLocation: e.target.value })} class="w-full border rounded-xl px-3 py-2 text-sm" /></div>
                        </div>
                        <div class="grid grid-cols-2 gap-3">
                          <div><label class="block text-[11px] font-semibold text-slate-500 mb-1">實際申報里程 (km)</label><input type="number" value={currentRecord.mileage} onChange={(e) => setCurrentRecord({ ...currentRecord, mileage: e.target.value })} class="w-full border rounded-xl px-3 py-2 text-sm font-bold" /></div>
                          <div><label class="block text-[11px] font-semibold text-slate-500 mb-1">自駕補貼 (NT$)</label><input type="number" value={currentRecord.subsidyAmount} readOnly class="w-full bg-slate-100 border rounded-xl px-3 py-2 text-sm font-bold text-indigo-700" /></div>
                        </div>
                        {getMileageStatus() && (getMileageStatus().isOver ? <div class="bg-amber-50 p-2.5 rounded-lg text-xs text-amber-800 font-bold">⚠️ 里程差異超標，但仍可存檔</div> : <div class="bg-emerald-50 p-2.5 rounded-lg text-xs text-emerald-800 font-bold">✅ 合乎里程規範</div>)}
                      </div>
                      <div class="grid grid-cols-2 gap-3">
                        <div><label class="block text-xs font-bold text-slate-500 mb-1.5">憑證日期</label><input type="date" value={currentRecord.date} onChange={(e) => setCurrentRecord({ ...currentRecord, date: e.target.value })} class="w-full border rounded-xl px-3 py-2.5 text-sm" /></div>
                        <div><label class="block text-xs font-bold text-slate-500 mb-1.5">憑證形式</label><select value={currentRecord.form} onChange={(e) => setCurrentRecord({ ...currentRecord, form: e.target.value })} class="w-full border rounded-xl px-3 py-2.5 text-sm">{CERTIFICATE_FORMS.map(f => <option key={f}>{f}</option>)}</select></div>
                      </div>
                      <textarea rows="2" value={currentRecord.description} onChange={(e) => setCurrentRecord({ ...currentRecord, description: e.target.value })} placeholder="說明" class="w-full border rounded-xl px-3 py-2.5 text-sm" />
                      <div class="border-t pt-4 grid grid-cols-2 gap-4">
                        <div>
                          <span class="block text-xs font-semibold text-slate-500 mb-2">影像 (選用)</span>
                          {capturedImage ? <div class="rounded-xl border aspect-[4/3] relative"><img src={capturedImage} class="w-full h-full object-contain" /></div> : <div class="rounded-xl border-2 border-dashed aspect-[4/3] flex items-center justify-center p-4"><label class="bg-indigo-600 text-white text-xs px-3 py-2 rounded">上傳<input type="file" accept="image/*" class="hidden" onChange={(e)=>{if(e.target.files[0]){const r=new FileReader();r.onload=(ev)=>{setCapturedImage(ev.target.result);startBackgroundOCR(ev.target.result);};r.readAsDataURL(e.target.files[0]);}}}/></label></div>}
                        </div>
                        {currentRecord.form.includes("車票") || currentRecord.form === "計程車乘車證明" ? <div class="bg-emerald-50 text-xs text-emerald-800 p-4 rounded-2xl">🎫 車票免核對</div> : <div class="border rounded-2xl p-4 bg-slate-50/50 space-y-3.5"><input type="text" placeholder="抬頭" value={currentRecord.companyTitle} onChange={(e) => setCurrentRecord({ ...currentRecord, companyTitle: e.target.value })} class="w-full bg-white border rounded-xl px-3 py-2 text-sm" /><input type="text" placeholder="統編" value={currentRecord.taxId} onChange={(e) => setCurrentRecord({ ...currentRecord, taxId: e.target.value })} class="w-full bg-white border rounded-xl px-3 py-2 text-sm font-mono" /></div>}
                      </div>
                    </div>
                  ) : (
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                      <div><span class="block text-xs font-bold text-slate-500 mb-2">憑證預覽</span>{capturedImage ? <div class="rounded-xl border aspect-[3/4]"><img src={capturedImage} class="w-full h-full object-contain" /></div> : <div class="rounded-xl border-2 border-dashed aspect-[3/4] flex items-center justify-center text-slate-400">無影像</div>}</div>
                      <div class="space-y-3">
                        <select value={currentRecord.category} onChange={(e) => setCurrentRecord({ ...currentRecord, category: e.target.value, subCategory: e.target.value === "交通費" ? "大眾運輸" : "" })} class="w-full border rounded-xl px-3 py-2 text-sm font-semibold">{MAIN_SUBJECTS.map(s => <option key={s}>{s}</option>)}</select>
                        {currentRecord.category === "交通費" && <select value={currentRecord.subCategory} onChange={(e) => setCurrentRecord({ ...currentRecord, subCategory: e.target.value })} class="w-full bg-indigo-50 border-indigo-200 rounded-xl px-3 py-2 text-sm font-semibold">{TRAFFIC_SUB_SUBJECTS.map(sub => <option key={sub}>{sub}</option>)}</select>}
                        <div class="grid grid-cols-2 gap-2">
                          <input type="date" value={currentRecord.date} onChange={(e) => setCurrentRecord({ ...currentRecord, date: e.target.value })} class="w-full border rounded-xl px-3 py-2 text-sm" />
                          <select value={currentRecord.form} onChange={(e) => setCurrentRecord({ ...currentRecord, form: e.target.value })} class="w-full border rounded-xl px-3 py-2 text-sm">{CERTIFICATE_FORMS.map(f => <option key={f}>{f}</option>)}</select>
                        </div>
                        {(!currentRecord.form.includes("車票") && currentRecord.form !== "計程車乘車證明") && <div class="border p-3 bg-slate-50 rounded-xl space-y-2"><input type="text" placeholder="抬頭" value={currentRecord.companyTitle} onChange={(e) => setCurrentRecord({ ...currentRecord, companyTitle: e.target.value })} class="w-full border rounded-xl px-3 py-2 text-sm" /><input type="text" placeholder="統編" value={currentRecord.taxId} onChange={(e) => setCurrentRecord({ ...currentRecord, taxId: e.target.value })} class="w-full border rounded-xl px-3 py-2 text-sm font-mono" /></div>}
                        <input type="number" placeholder="金額" value={currentRecord.amount} onChange={(e) => setCurrentRecord({ ...currentRecord, amount: e.target.value })} class="w-full border rounded-xl px-3 py-2 text-sm font-bold text-indigo-600" />
                        <textarea rows="2" placeholder="說明" value={currentRecord.description} onChange={(e) => setCurrentRecord({ ...currentRecord, description: e.target.value })} class="w-full border rounded-xl px-3 py-2 text-sm" />
                      </div>
                    </div>
                  )}
                </div>
                <div class="bg-slate-50 p-5 border-t flex space-x-3"><button onClick={() => { cancelOcr(); setShowConfirmModal(false); }} class="flex-1 bg-white border py-3 rounded-xl font-semibold text-sm">取消</button><button onClick={handleConfirmSave} class="flex-1 bg-slate-900 text-white py-3 rounded-xl font-semibold text-sm shadow">確認無誤，彙整儲存</button></div>
              </div>
            </div>
          )}

          {/* --- Modal 3-6: Alerts & Exports --- */}
          {showDuplicateModal && (
            <div class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div class="bg-white rounded-3xl w-full max-w-md p-6 text-center"><span class="text-5xl">⚠️</span><h3 class="text-xl font-bold text-amber-600 mb-2 mt-2">發現疑似重複憑證</h3><div class="text-sm bg-amber-50 p-4 rounded-xl mb-6">有 {duplicateIds.length} 筆憑證完全相同。自動刪除重複，還是保留全部匯出？</div>
                <div class="space-y-2"><button onClick={removeDuplicatesAndExport} class="w-full bg-indigo-600 text-white font-bold py-3 rounded-xl">🗑️ 自動刪除重複並匯出</button><button onClick={ignoreDuplicatesAndExport} class="w-full bg-slate-200 text-slate-800 font-bold py-3 rounded-xl">保留全部並匯出</button><button onClick={() => setShowDuplicateModal(false)} class="w-full bg-white text-slate-500 py-3 rounded-xl border">取消</button></div>
              </div>
            </div>
          )}

          {showExportModal && (
            <div class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div class="bg-white rounded-3xl w-full max-w-sm p-6 text-center"><div class="flex justify-end"><button onClick={() => setShowExportModal(false)} class="text-slate-400">✕</button></div><div class="w-16 h-16 bg-emerald-50 text-emerald-600 rounded-full flex items-center justify-center mx-auto mb-4"><IconDownload /></div><h3 class="text-lg font-bold mb-2">匯出選項</h3>
                <div class="space-y-3 mt-6"><button onClick={handleSaveLocal} class="w-full bg-indigo-600 text-white font-bold py-3 rounded-xl shadow">⬇️ 儲存至本機</button><button onClick={handleSystemShare} class="w-full bg-slate-900 text-white font-bold py-3 rounded-xl shadow flex justify-center space-x-2"><IconShare /><span>📤 分享/傳送</span></button></div>
              </div>
            </div>
          )}

          {showAlertModal && (
            <div class="fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div class="bg-white rounded-3xl w-full max-w-sm p-6 text-center"><div class="flex justify-center mb-4"><IconAlert /></div><h3 class="text-lg font-bold text-rose-600 mb-2">系統提示</h3><div class="text-sm bg-rose-50 p-4 rounded-xl mb-5 whitespace-pre-wrap text-left">{alertMessage}</div><button onClick={() => setShowAlertModal(false)} class="w-full bg-slate-900 text-white font-bold py-3 rounded-xl">確認</button></div>
            </div>
          )}

          {showClearConfirmModal && (
            <div class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div class="bg-white rounded-3xl w-full max-w-sm p-6 text-center"><span class="text-5xl">🗑️</span><h3 class="text-xl font-bold text-rose-600 mb-2 mt-2">確認清除所有明細？</h3><div class="text-sm bg-rose-50 p-4 rounded-xl mb-6">⚠️ 操作無法復原，請確認是否繼續？</div>
                <div class="space-y-2"><button onClick={confirmClearRecords} class="w-full bg-rose-600 text-white font-bold py-3 rounded-xl">是的，確認清除</button><button onClick={() => setShowClearConfirmModal(false)} class="w-full bg-slate-200 text-slate-800 font-bold py-3 rounded-xl">取消</button></div>
              </div>
            </div>
          )}

          {showSettingsModal && (
            <div class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div class="bg-white rounded-3xl w-full max-w-md p-6 animate-in fade-in zoom-in-95">
                <div class="flex justify-between items-center mb-5"><h3 class="text-lg font-bold text-slate-900">⚙️ 系統設定</h3><button onClick={() => setShowSettingsModal(false)} class="text-slate-400 hover:text-slate-600">✕</button></div>
                <div class="space-y-4">
                  <div>
                    <label class="block text-sm font-bold text-slate-700 mb-2">Google Gemini API Key</label>
                    <p class="text-xs text-slate-500 mb-3 leading-relaxed">為保護資安，API Key 不再寫死於原始碼中。若您要在 GitHub Pages 等外部環境使用 AI 辨識，請在此填入您的專屬金鑰 (金鑰僅儲存於您目前的瀏覽器本地端，安全無虞)。</p>
                    <input type="password" placeholder="請輸入您的金鑰..." value={customApiKey} onChange={(e) => setCustomApiKey(e.target.value)} class="w-full border border-slate-200 rounded-xl px-3 py-2.5 text-sm font-mono focus:border-indigo-500 outline-none" />
                  </div>
                  <button onClick={() => setShowSettingsModal(false)} class="w-full bg-slate-900 hover:bg-slate-800 text-white font-bold py-3 rounded-xl shadow transition-colors">儲存設定並關閉</button>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    const rootElement = document.getElementById("root");
    const root = ReactDOM.createRoot(rootElement);
    root.render(<App />);
  </script>
</body>
</html>
