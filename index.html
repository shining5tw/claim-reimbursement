    // --- 大圓里程計算函數 (Haversine) + 1.35x 蜿蜒度修正 ---
    const calculateMapDistance = (start, end) => {
      if (!start || !end) return 0;
      let p1 = null;
      let p2 = null;

      // 模糊比對
      for (const [key, value] of Object.entries(TAIWAN_LOCATIONS)) {
        if (start.toLowerCase().includes(key)) p1 = value;
        if (end.toLowerCase().includes(key)) p2 = value;
      }

      // 雜湊虛擬定位 (確保非資料庫地標測試正常)
      if (!p1) {
        let h = 0;
        for (let i = 0; i < start.length; i++) h = start.charCodeAt(i) + ((h << 5) - h);
        p1 = { lon: 120.2 + (Math.abs(h % 150) / 100), lat: 22.5 + (Math.abs((h >> 3) % 250) / 100) };
      }
      if (!p2) {
        let h = 0;
        for (let i = 0; i < end.length; i++) h = end.charCodeAt(i) + ((h << 5) - h);
        p2 = { lon: 120.2 + (Math.abs(h % 150) / 100), lat: 22.5 + (Math.abs((h >> 3) % 250) / 100) };
      }

      const R = 6371; // km
      const dLat = (p2.lat - p1.lat) * Math.PI / 180;
      const dLon = (p2.lon - p1.lon) * Math.PI / 180;
      const a = 
        Math.sin(dLat/2) * Math.sin(dLat/2) +
        Math.cos(p1.lat * Math.PI / 180) * Math.cos(p2.lat * Math.PI / 180) * Math.sin(dLon/2) * Math.sin(dLon/2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
      const straightDist = R * c;

      return Math.round(straightDist * 1.35 * 10) / 10;
    };

    // --- 精準輕量 CSV 解析狀態機 ---
    const parseCSV = (text) => {
      const lines = [];
      let row = [""];
      let inQuotes = false;
      for (let i = 0; i < text.length; i++) {
        const c = text[i];
        const next = text[i+1];
        if (c === '"') {
          if (inQuotes && next === '"') {
            row[row.length - 1] += '"';
            i++;
          } else {
            inQuotes = !inQuotes;
          }
        } else if (c === ',' && !inQuotes) {
          row.push('');
        } else if ((c === '\r' || c === '\n') && !inQuotes) {
          if (c === '\r' && next === '\n') { i++; }
          lines.push(row);
          row = [''];
        } else {
          row[row.length - 1] += c;
        }
      }
      if (row.length > 1 || row[0] !== '') {
        lines.push(row);
      }
      return lines;
    };

              if (response.ok) {
                const result = await response.json();
                const jsonText = result.candidates?.[0]?.content?.parts?.[0]?.text;
                parsedData = JSON.parse(jsonText);
                success = true;
                break;
              }
            } catch (err) {
              if (err.name === 'AbortError') return;
            }
            await new Promise(resolve => setTimeout(resolve, delay));
            delay *= 2;
          }

          if (success && parsedData) {
            setCurrentRecord(prev => ({
              ...prev,
              date: parsedData.date || prev.date,
              form: CERTIFICATE_FORMS.includes(parsedData.form) ? parsedData.form : "其他",
              formCustom: CERTIFICATE_FORMS.includes(parsedData.form) ? "" : parsedData.form,
              category: MAIN_SUBJECTS.includes(parsedData.category) ? parsedData.category : "其他(手動輸入)",
              amount: prev.amount === "" ? (parsedData.amount || "") : prev.amount,
              description: prev.description === "" ? (parsedData.description || "") : prev.description,
              companyTitle: prev.companyTitle === "" ? (parsedData.companyTitle || "") : prev.companyTitle,
              taxId: prev.taxId === "" ? (parsedData.taxId || "") : prev.taxId
            }));
          }
        } else {
          // --- 模擬快速辨識 ---
          try {
            await new Promise((resolve, reject) => {
              const timer = setTimeout(resolve, 1000);
              ocrControllerRef.current.signal.addEventListener('abort', () => {
                clearTimeout(timer);
                reject(new DOMException('Aborted', 'AbortError'));
              });
            });

            const rand = Math.random();
            let mockTitle = "茂生食品股份有限公司";
            let mockTaxId = "85099593";
            
            if (rand < 0.3) {
              mockTitle = "個人憑證";
              mockTaxId = "";
            }

            setCurrentRecord(prev => ({
              ...prev,
              amount: prev.amount === "" ? (Math.floor(Math.random() * 1200) + 150) : prev.amount,
              description: prev.description === "" ? "公務出行加油單據" : prev.description,
              companyTitle: prev.companyTitle === "" ? mockTitle : prev.companyTitle,
              taxId: prev.taxId === "" ? mockTaxId : prev.taxId
            }));
          } catch (e) {
            if (e.name === 'AbortError') return;
          }
        }
        setIsOcrLoading(false);
      };

      const cancelOcr = () => {
        if (ocrControllerRef.current) {
          ocrControllerRef.current.abort();
        }
        setIsOcrLoading(false);
      };

      // --- 差旅費油資補貼手動輸入模式 ---
      const startManualInput = () => {
        setCapturedImage(null);
        setInputMethod("manual");
        setIsOcrLoading(false);
        setCurrentRecord({
          date: new Date().toISOString().split("T")[0],
          form: "電子發票",
          formCustom: "",
          category: "差旅費油資補貼",
          subCategory: "",
          categoryCustom: "",
          amount: "",
          description: "",
          companyTitle: "茂生食品股份有限公司",
          taxId: "",
          startLocation: "茂生食品",
          endLocation: "",
          mileage: "",
          subsidyAmount: ""
        });
        setShowAddModal(false);
        setShowConfirmModal(true);
      };

      // --- 確認儲存主流程 ---
      const handleConfirmSave = () => {
        // 先防呆員工基本資料
        if (!employeeName.trim() || !employeeDept.trim()) {
          triggerAlert("請先在首頁填寫「員工姓名」與「部門」資訊！");
          return;
        }

        // 交通車票與計程車相關形式判定 (高鐵、捷運、火車車票與計程車相關免除統編抬頭檢核)
        const isTicketExempt = currentRecord.form.includes("車票") || currentRecord.form === "計程車乘車證明";

        const cleanTitle = currentRecord.companyTitle.trim();
        const cleanTaxId = currentRecord.taxId.trim();

        if (!isTicketExempt) {
          const isTitleValid = cleanTitle === TARGET_COMPANY;
          const isTaxIdValid = cleanTaxId === TARGET_TAX_ID;

          if (!isTitleValid && !isTaxIdValid) {
            triggerAlert(`【憑證不合規警告】\n發票抬頭或統一編號需擇一符合，方可申報：\n\n・合規抬頭需為：「${TARGET_COMPANY}」\n・合規統編需為：「${TARGET_TAX_ID}」\n\n目前輸入不符，請重新修正。\n(若為交通車票或計程車收據，請變更憑證形式為「紙質車票」或「電子車票」或「計程車乘車證明」)`);
            return;
          }
        }

        // 差旅費油資補貼防呆
        if (currentRecord.category === "差旅費油資補貼") {
          if (!currentRecord.startLocation || !currentRecord.endLocation) {
            triggerAlert("「差旅費油資補貼」必須輸入起始地點與結束地點。");
            return;
          }
          if (!currentRecord.mileage || isNaN(currentRecord.mileage) || Number(currentRecord.mileage) <= 0) {
            triggerAlert("請輸入正確的實際申報里程。");
            return;
          }
        } else {
          // 一般科目
          if (!currentRecord.amount || isNaN(currentRecord.amount) || Number(currentRecord.amount) <= 0) {
            triggerAlert("請輸入大於 0 的正確金額。");
            return;
          }
        }

        // 寫入清單
        const newRecord = {
          ...currentRecord,
          id: Date.now(),
          employeeName: employeeName.trim(),
          employeeDept: employeeDept.trim(),
          amount: Number(currentRecord.amount)
        };

        setRecords([newRecord, ...records]);
        setShowConfirmModal(false);
        setCapturedImage(null);
        setInputMethod("");
      };

      // --- 刪除紀錄 ---
      const handleDeleteRecord = (id) => {
        setRecords(records.filter(r => r.id !== id));
        if (editingId === id) {
          setEditingId(null);
          setEditRowData(null);
        }
      };

      // --- 行內直接編輯 (Inline Editing) 邏輯處理 ---
      const startInlineEdit = (record) => {
        setEditingId(record.id);
        setEditRowData({ ...record });
      };

      const handleEditFieldChange = (field, val) => {
        setEditRowData(prev => {
          const updated = { ...prev, [field]: val };

          // 若為自駕車補貼且在行內編輯，同樣進行即時里程換算與聯動
          if (updated.category === "差旅費油資補貼") {
            if (field === "startLocation" || field === "endLocation" || field === "mileage") {
              if (updated.mileage) {
                const computedCost = Math.round(Number(updated.mileage) * SUBSIDY_RATE);
                updated.subsidyAmount = computedCost;
                updated.amount = computedCost;
              }
            }
          }
          return updated;
        });
      };

      const saveInlineEdit = () => {
        if (!editRowData.employeeName.trim() || !editRowData.employeeDept.trim()) {
          triggerAlert("「姓名」與「部門」欄位不得為空！");
          return;
        }

        const isTicketExempt = editRowData.form.includes("車票") || editRowData.form === "計程車乘車證明";
        const cleanTitle = editRowData.companyTitle.trim();
        const cleanTaxId = editRowData.taxId.trim();

        if (!isTicketExempt) {
          const isTitleValid = cleanTitle === TARGET_COMPANY;
          const isTaxIdValid = cleanTaxId === TARGET_TAX_ID;

          if (!isTitleValid && !isTaxIdValid) {
            triggerAlert(`【編輯儲存失敗】\n抬頭或統編需擇一符合：\n抬頭：「${TARGET_COMPANY}」或 統編：「${TARGET_TAX_ID}」。\n(交通車票/計程車收據請變更憑證形式)`);
            return;
          }
        }

        if (editRowData.category === "差旅費油資補貼") {
          if (!editRowData.startLocation || !editRowData.endLocation || !editRowData.mileage || isNaN(editRowData.mileage) || Number(editRowData.mileage) <= 0) {
            triggerAlert("「差旅費油資補貼」必須有起迄地點與正確里程。");
            return;
          }
        } else {
          if (!editRowData.amount || isNaN(editRowData.amount) || Number(editRowData.amount) <= 0) {
            triggerAlert("請輸入正確大於 0 的費用金額。");
            return;
          }
        }

        // 修改完畢，同步回 records state
        setRecords(records.map(r => r.id === editingId ? { ...editRowData, amount: Number(editRowData.amount) } : r));
        setEditingId(null);
        setEditRowData(null);
      };

      const cancelInlineEdit = () => {
        setEditingId(null);
        setEditRowData(null);
      };

      // --- 產生 CSV 文字內容 ---
      const generateCSVContent = () => {
        let csvContent = "\uFEFF"; // BOM (防止 Excel 亂碼)
        csvContent += "姓名,部門,憑證日期,憑證形式,會計科目,副科目,費用金額,發票抬頭,統一編號,起始地點,結束地點,行駛里程(km),油資補貼,說明\n";

        records.forEach(r => {
          const formText = r.form === "其他" ? r.formCustom : r.form;
          const catText = r.category === "其他(手動輸入)" ? r.categoryCustom : r.category;
          const isDrive = r.category === "差旅費油資補貼";
          csvContent += `"${r.employeeName}","${r.employeeDept}","${r.date}","${formText}","${catText}","${r.subCategory || ''}",${r.amount},"${r.companyTitle}","${r.taxId}","${isDrive ? r.startLocation : ''}","${isDrive ? r.endLocation : ''}","${isDrive ? r.mileage : ''}","${isDrive ? r.subsidyAmount : ''}","${r.description}"\n`;
        });
        return csvContent;
      };

      // --- 本機儲存 CSV 下載 ---
      const handleSaveLocal = () => {
        if (records.length === 0) {
          triggerAlert("目前尚無報銷明細可供儲存。");
          return;
        }
        const csvContent = generateCSVContent();
        const blob = new Blob([csvContent], { type: "text/csv;charset=utf-8;" });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.setAttribute("href", url);
        link.setAttribute("download", `費用報銷彙整表_${new Date().toISOString().split("T")[0]}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        setShowExportModal(false);
      };

      // --- 呼叫手機分享 ---
      const handleSystemShare = async () => {
        if (records.length === 0) {
          triggerAlert("目前尚無報銷明細可供分享。");
          return;
        }
        const csvContent = generateCSVContent();
        const filename = `費用報銷彙整表_${new Date().toISOString().split("T")[0]}.csv`;
        const blob = new Blob([csvContent], { type: "text/csv;charset=utf-8;" });

        if (navigator.canShare && navigator.share) {
          try {
            const file = new File([blob], filename, { type: "text/csv" });
            if (navigator.canShare({ files: [file] })) {
              await navigator.share({
                files: [file],
                title: "費用報銷彙整表",
                text: "請查收導出之費用報銷彙整表 CSV 檔案。"
              });
              setShowExportModal(false);
            } else {
              triggerAlert("您的行動裝置瀏覽器不支援直接分享此類型檔案，已自動為您切換至「本機下載/儲存」。");
              handleSaveLocal();
            }
          } catch (err) {
            if (err.name !== "AbortError") {
              triggerAlert("分享失敗，已自動為您執行「本機下載/儲存」。");
              handleSaveLocal();
            }
          }
        } else {
          triggerAlert("您的瀏覽器不支援原生分享（通常僅支援手機版），已自動為您執行「本機下載/儲存」。");
          handleSaveLocal();
        }
      };

      // 輔助函數：放寬檢核標頭模糊尋找定位
      const findFuzzyIndex = (header, keywords) => {
        return header.findIndex(h => {
          const clean = h.trim().toLowerCase().replace(/^\uFEFF/, '');
          return keywords.some(kw => clean.includes(kw));
        });
      };

      // --- 智慧 CSV 檔案放寬匯入解析 (Fuzzy Import Engine) ---
      const handleCSVImport = (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (event) => {
          try {
            const arrayBuffer = event.target.result;
            const uint8Array = new Uint8Array(arrayBuffer);

            // 智慧自動偵測編碼：嘗試以 UTF-8 (fatal: true) 嚴格解碼，若失敗則判定為台灣 Windows Excel 預設的 Big5 格式
            let encoding = 'utf-8';
            try {
              const utf8Decoder = new TextDecoder('utf-8', { fatal: true });
              utf8Decoder.decode(uint8Array);
              encoding = 'utf-8';
            } catch (err) {
              encoding = 'big5';
            }

            const decoder = new TextDecoder(encoding);
            const text = decoder.decode(uint8Array);
            const rows = parseCSV(text);
            if (rows.length === 0) {
              triggerAlert("匯入失敗：檔案內容為空。");
              return;
            }

            // 定位索引 (若為 -1 則表示無該列，套用預設)
            const nameIdx = findFuzzyIndex(header, ["姓名", "員工", "申報", "name"]);
            const deptIdx = findFuzzyIndex(header, ["部門", "單位", "課室", "dept"]);
            const dateIdx = findFuzzyIndex(header, ["憑證日期", "日期", "時間", "date"]);
            const formIdx = findFuzzyIndex(header, ["憑證形式", "形式", "種類", "type"]);
            const catIdx = findFuzzyIndex(header, ["會計科目", "科目", "category", "主選項"]);
            const subCatIdx = findFuzzyIndex(header, ["副科目", "副分類", "子選項"]);
            const amountIdx = findFuzzyIndex(header, ["費用金額", "金額", "費用", "amount", "價錢"]);
            const titleIdx = findFuzzyIndex(header, ["發票抬頭", "抬頭", "買受人", "title"]);
            const taxIdx = findFuzzyIndex(header, ["統一編號", "統編", "編號", "tax"]);
            const startIdx = findFuzzyIndex(header, ["起始地點", "起點", "出發地", "start"]);
            const endIdx = findFuzzyIndex(header, ["結束地點", "迄點", "目的地", "end"]);
            const mileageIdx = findFuzzyIndex(header, ["行駛里程", "里程", "mileage"]);
            const subsidyIdx = findFuzzyIndex(header, ["油資補貼", "補貼額"]);
            const descIdx = findFuzzyIndex(header, ["說明", "備註", "事由", "desc"]);

            const importedRecords = [];
            const startRowIdx = hasHeader ? 1 : 0;

            for (let i = startRowIdx; i < rows.length; i++) {
              const row = rows[i];
              // 跳過幾乎無內容的空行
              if (row.length === 0 || (row.length === 1 && row[0] === "")) continue;

              // 寬容帶入：取值 (若沒索引則找對應合理順序塞，或給予預設值)
              const empName = nameIdx !== -1 ? (row[nameIdx] || "") : (row[0] || employeeName || "未命名");
              const empDept = deptIdx !== -1 ? (row[deptIdx] || "") : (row[1] || employeeDept || "未填部門");
              const pDate = dateIdx !== -1 ? (row[dateIdx] || "") : (row[2] || new Date().toISOString().split("T")[0]);
              const rawForm = formIdx !== -1 ? (row[formIdx] || "") : (row[3] || "電子發票");
              const rawCat = catIdx !== -1 ? (row[catIdx] || "") : (row[4] || "交通費");
              const subCategory = subCatIdx !== -1 ? (row[subCatIdx] || "") : (row[5] || "");
              
              // 尋找金額 (若無標頭則猜測數字最多的欄位)
              let amountStr = "0";
              if (amountIdx !== -1) {
                amountStr = row[amountIdx];
              } else {
                const numericCol = row.find(val => !isNaN(val) && val !== "" && Number(val) > 0);
                if (numericCol) amountStr = numericCol;
              }
              const amount = Number(amountStr) || 0;

              const companyTitle = titleIdx !== -1 ? (row[titleIdx] || "") : (row[7] || "");
              const taxId = taxIdx !== -1 ? (row[taxIdx] || "") : (row[8] || "");
              const startLocation = startIdx !== -1 ? (row[startIdx] || "") : "茂生食品";
              const endLocation = endIdx !== -1 ? (row[endIdx] || "") : "";
              const mileage = mileageIdx !== -1 ? (row[mileageIdx] || "") : "";
              const subsidyAmount = subsidyIdx !== -1 ? (row[subsidyIdx] ? Number(row[subsidyIdx]) : "") : "";
              const description = descIdx !== -1 ? (row[descIdx] || "") : (row[row.length - 1] || "");

              // 歸類形式與科目
              let form = rawForm;
              let formCustom = "";
              if (!CERTIFICATE_FORMS.includes(rawForm)) {
                form = "其他";
                formCustom = rawForm;
              }

              let category = rawCat;
              let categoryCustom = "";
              if (!MAIN_SUBJECTS.includes(rawCat)) {
                category = "其他(手動輸入)";
                categoryCustom = rawCat;
              }

              importedRecords.push({
                id: Date.now() + i + Math.random(),
                employeeName: empName,
                employeeDept: empDept,
                date: pDate,
                form,
                formCustom,
                category,
                categoryCustom,
                subCategory,
                amount,
                companyTitle,
                taxId,
                startLocation,
                endLocation,
                mileage,
                subsidyAmount,
                description
              });
            }

            if (importedRecords.length === 0) {
              triggerAlert("匯入失敗：未找到任何有效的報銷明細數值。");
              return;
            }

            setRecords(prev => [...importedRecords, ...prev]);

            // 自動更新基本欄位
            if (importedRecords[0].employeeName) setEmployeeName(importedRecords[0].employeeName);
            if (importedRecords[0].employeeDept) setEmployeeDept(importedRecords[0].employeeDept);

            triggerAlert(`成功寬容解析並匯入 ${importedRecords.length} 筆報銷明細！您可以直接在下方表格直接點擊編輯微調。`);
          } catch (err) {
            triggerAlert("匯入檔案解析失敗，請確認是否為可讀取的 CSV 檔案。");
          }
        };
        reader.readAsArrayBuffer(file);
        e.target.value = ""; // 重設
      };

      const isTicketRelated = currentRecord.form.includes("車票") || currentRecord.form === "計程車乘車證明";

      return (
        <div class="max-w-4xl mx-auto p-4 md:p-6 pb-24">
          
          {/* --- 頁首 --- */}
          <header class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-6 bg-slate-900 text-white p-5 rounded-2xl shadow-lg">
            <div>
              <span class="text-xs bg-indigo-600 text-indigo-100 font-semibold px-2.5 py-1 rounded-full uppercase tracking-wider">
                茂生食品股份有限公司
              </span>
              <h1 class="text-2xl font-bold mt-2">費用報銷彙整表</h1>
              <p class="text-slate-400 text-xs mt-1">全體員工通用・憑證行內秒速編輯、智慧寬容歷史匯入與多管道影像辨識</p>
            </div>
            <div class="mt-4 sm:mt-0">
              <span class="bg-slate-800 text-slate-300 px-3 py-1.5 rounded-lg text-sm border border-slate-700 font-mono">
                系統版本：{VERSION}
              </span>
            </div>
          </header>

          {/* --- 申報人基本資訊 (首頁直接填入) --- */}
          <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 mb-6">
            <h3 class="text-sm font-bold text-slate-800 mb-3 flex items-center">
              <span class="mr-1.5">👤</span> 申報人基本資訊
            </h3>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
              <div>
                <label class="block text-xs font-semibold text-slate-500 mb-1">員工姓名 <span class="text-rose-500">*</span></label>
                <input 
                  type="text"
                  placeholder="請輸入姓名"
                  value={employeeName}
                  onChange={(e) => setEmployeeName(e.target.value)}
                  class="w-full bg-slate-50 border border-slate-200 focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 rounded-xl px-3 py-2 text-sm font-medium outline-none transition-all"
                />
              </div>
              <div>
                <label class="block text-xs font-semibold text-slate-500 mb-1">申報部門 <span class="text-rose-500">*</span></label>
                <input 
                  type="text"
                  placeholder="請輸入部門 (如：會計部)"
                  value={employeeDept}
                  onChange={(e) => setEmployeeDept(e.target.value)}
                  class="w-full bg-slate-50 border border-slate-200 focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 rounded-xl px-3 py-2 text-sm font-medium outline-none transition-all"
                />
              </div>
            </div>
          </div>

          {/* --- 儀表板總覽 --- */}
          <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 flex flex-col justify-between">
              <span class="text-slate-500 text-sm font-medium">申報總累計金額</span>
              <div class="flex items-baseline space-x-2 mt-2">
                <span class="text-3xl font-extrabold text-indigo-600">NT$ {totalAmount.toLocaleString()}</span>
                <span class="text-slate-400 text-xs">元</span>
              </div>
              <div class="mt-3 text-xs text-slate-400 border-t pt-2">
                總計筆數: {records.length} 筆
              </div>
            </div>

            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 md:col-span-2">
              <div class="flex justify-between items-center mb-3">
                <span class="text-slate-500 text-sm font-medium">科目核銷統計</span>
                <span class="text-xs text-indigo-600 font-semibold bg-indigo-50 px-2 py-0.5 rounded font-mono">核銷分佈分析</span>
              </div>
              
              {Object.keys(categorySummary).length === 0 ? (
                <div class="text-slate-400 text-sm py-4 text-center">暫無申報數據，請新增憑證或點選匯入。</div>
              ) : (
                <div class="grid grid-cols-2 gap-x-4 gap-y-2 font-mono text-xs">
                  {Object.entries(categorySummary).map(([cat, val]) => (
                    <div key={cat} class="flex items-center justify-between py-1 border-b border-dashed border-slate-100">
                      <span class="text-slate-600 truncate max-w-[120px]">{cat}</span>
                      <span class="font-bold text-slate-900">NT$ {val.toLocaleString()}</span>
                    </div>
                  ))}

                        {/* 說明 */}
                        <div>
                          <label class="block text-xs font-bold text-slate-500 mb-1">申報說明</label>
                          <span class="block text-[10px] text-slate-400 mb-1.5">(備註：請說明差旅原因、特殊狀況等)</span>
                          <textarea 
                            rows="2"
                            value={currentRecord.description}
                            onChange={(e) => setCurrentRecord({ ...currentRecord, description: e.target.value })}
                            placeholder="請輸入費用事由及特殊狀況"
                            class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 text-sm focus:ring-2 focus:ring-indigo-500 outline-none"
                          />
                        </div>

                      </div>
                    </div>
                  )}

                </div>

                {/* 按鈕底部 */}
                <div class="bg-slate-50 p-5 border-t border-slate-100 flex space-x-3">
                  <button 
                    onClick={() => {
                      cancelOcr();
                      setShowConfirmModal(false);
                    }}
                    class="flex-1 bg-white hover:bg-slate-100 border border-slate-200 py-3 rounded-xl font-semibold text-sm transition-all text-slate-700"
                  >
                    取消
                  </button>
                  <button 
                    onClick={handleConfirmSave}
                    class="flex-1 bg-slate-900 hover:bg-slate-800 text-white py-3 rounded-xl font-semibold text-sm transition-all shadow-md"
                  >
                    確認無誤，彙整儲存
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* --- 視窗 3：匯出選擇彈出框 (本機儲存 vs 手機應用程式分享) --- */}
          {showExportModal && (
            <div class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div class="bg-white rounded-3xl w-full max-w-sm p-6 shadow-2xl border border-slate-100 text-center animate-in fade-in zoom-in-95 duration-200">
                <div class="flex justify-end">
                  <button onClick={() => setShowExportModal(false)} class="text-slate-400 hover:text-slate-600 p-1">✕</button>
                </div>
                <div class="w-16 h-16 bg-emerald-50 text-emerald-600 rounded-full flex items-center justify-center mx-auto mb-4">
                  <IconDownload />
                </div>
                <h3 class="text-lg font-bold text-slate-900 mb-2">匯出報表與儲存選項</h3>
                <p class="text-xs text-slate-400 mb-6">請選擇報銷彙整表 CSV 的導出管道：</p>
                
                <div class="space-y-3">
                  <button 
                    onClick={handleSaveLocal}
                    class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-4 rounded-xl shadow transition-all flex items-center justify-center space-x-2"
                  >
                    <span>⬇️ 儲存/下載至手機與本機</span>
                  </button>
                  
                  <button 
                    onClick={handleSystemShare}
                    class="w-full bg-slate-900 hover:bg-slate-800 text-white font-bold py-3 px-4 rounded-xl shadow transition-all flex items-center justify-center space-x-2"
                  >
                    <IconShare />
                    <span>📤 行動裝置分享/直接傳送</span>
                  </button>
                </div>
                
                <button 
                  onClick={() => setShowExportModal(false)}
                  class="w-full mt-4 bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold py-2 rounded-xl transition-all text-xs"
                >
                  關閉
                </button>
              </div>
            </div>
          )}

          {/* --- 視窗 4：客製化錯誤警告框 --- */}
          {showAlertModal && (
            <div class="fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div class="bg-white rounded-3xl w-full max-w-sm p-6 shadow-2xl border border-rose-100 text-center animate-in fade-in zoom-in-95 duration-200">
                <div class="flex justify-center mb-4">
                  <IconAlert />
                </div>
                <h3 class="text-lg font-bold text-rose-600 mb-2">核銷申報失敗</h3>
                <div class="text-sm text-slate-600 text-left bg-rose-50 p-4 rounded-xl mb-5 space-y-2 whitespace-pre-wrap leading-relaxed font-medium font-sans">
                  {alertMessage}
                </div>
                <button 
                  onClick={() => setShowAlertModal(false)}
                  class="w-full bg-slate-900 hover:bg-slate-800 text-white font-bold py-3 rounded-xl transition-all"
                >
                  我知道了，重新核對
                </button>
              </div>
            </div>
          )}

        </div>
      );
    }

    const rootElement = document.getElementById("root");
    const root = ReactDOM.createRoot(rootElement);
    root.render(<App />);
  </script>
</body>
</html>
