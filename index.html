    // --- 大圓里程計算函數 (Haversine) + 1.35x 蜿蜒度修正 ---
    const calculateMapDistance = (start, end) => {
      if (!start || !end) return 0;
      let p1 = null;
      let p2 = null;

      for (const [key, value] of Object.entries(TAIWAN_LOCATIONS)) {
        if (start.toLowerCase().includes(key)) p1 = value;
        if (end.toLowerCase().includes(key)) p2 = value;
      }

      if (!p1) {
        let h = 0;
        for (let i = 0; i < start.length; i++) h = start.charCodeAt(i) + ((h << 5) - h);
        p1 = { lon: 120.2 + (Math.abs(h % 150) / 100), lat: 22.5 + (Math.abs((h >> 3) % 250) / 100) };
      }
      if (!p2) {
        let h = 0;
        for (let i = 0; i < end.length; i++) h = end.charCodeAt(i) + ((h << 5) - h);
        p2 = { lon: 120.2 + (Math.abs(h % 150) / 100), lat: 22.5 + (Math.abs((h >> 3) % 250) / 100) };
      }

      const R = 6371; // km
      const dLat = (p2.lat - p1.lat) * Math.PI / 180;
      const dLon = (p2.lon - p1.lon) * Math.PI / 180;
      const a = 
        Math.sin(dLat/2) * Math.sin(dLat/2) +
        Math.cos(p1.lat * Math.PI / 180) * Math.cos(p2.lat * Math.PI / 180) * Math.sin(dLon/2) * Math.sin(dLon/2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
      const straightDist = R * c;

      return Math.round(straightDist * 1.35 * 10) / 10;
    };

    // --- 精準輕量 CSV 解析狀態機 ---
    const parseCSV = (text) => {
      const lines = [];
      let row = [""];
      let inQuotes = false;
      for (let i = 0; i < text.length; i++) {
        const c = text[i];
        const next = text[i+1];
        if (c === '"') {
          if (inQuotes && next === '"') {
            row[row.length - 1] += '"';
            i++;
          } else {
            inQuotes = !inQuotes;
          }
        } else if (c === ',' && !inQuotes) {
          row.push('');
        } else if ((c === '\r' || c === '\n') && !inQuotes) {
          if (c === '\r' && next === '\n') { i++; }
          lines.push(row);
          row = [''];
        } else {
          row[row.length - 1] += c;
        }
      }
      if (row.length > 1 || row[0] !== '') {
        lines.push(row);
      }
      return lines;
    };

                        重要抓取規則（請嚴格遵守）：
                        1. date (憑證日期): 尋找票根、發票或收據上的「實際交易/乘車日期」 (格式 YYYY-MM-DD)。**絕對不可使用系統當前日期**。

                    responseSchema: {
                      type: "ARRAY",
                      description: "圖片中所有的發票、車票或收據。若有多張，請回傳多個物件。",
                      items: {
                        type: "OBJECT",
                        properties: {
                          date: { type: "STRING" },
                          form: { type: "STRING" },
                          category: { type: "STRING" },
                          subCategory: { type: "STRING" },
                          amount: { type: "INTEGER" },
                          description: { type: "STRING" },
                          companyTitle: { type: "STRING" },
                          taxId: { type: "STRING" }
                        },
                        required: ["date", "form", "category", "amount", "description", "companyTitle", "taxId"]
                      }
                    }
                  }
                })
              });

              if (response.ok) {
                const result = await response.json();
                const jsonText = result.candidates?.[0]?.content?.parts?.[0]?.text;
                parsedData = JSON.parse(jsonText);
                success = true;
                break;
              }
            } catch (err) {
              if (err.name === 'AbortError') return;
            }
            await new Promise(resolve => setTimeout(resolve, delay));
            delay *= 2;
          }

          if (success && parsedData && Array.isArray(parsedData) && parsedData.length > 0) {
            if (parsedData.length === 1) {
              // 單張憑證：直接回填當前畫面
              const item = parsedData[0];
              setCurrentRecord(prev => ({
                ...prev,
                date: item.date || prev.date,
                form: CERTIFICATE_FORMS.includes(item.form) ? item.form : prev.form,
                formCustom: CERTIFICATE_FORMS.includes(item.form) ? "" : item.form,
                category: MAIN_SUBJECTS.includes(item.category) ? item.category : prev.category,
                categoryCustom: MAIN_SUBJECTS.includes(item.category) ? "" : item.category,
                subCategory: item.subCategory || prev.subCategory,
                amount: item.amount || prev.amount,
                description: item.description || prev.description,
                companyTitle: item.companyTitle || prev.companyTitle,
                taxId: item.taxId || prev.taxId
              }));
            } else {
              // 多張憑證 (例如 A4 上貼了多張)：自動批次加入表格
              const newRecords = parsedData.map((item, idx) => ({
                id: Date.now() + idx,
                employeeName: employeeName || "未填寫",
                employeeDept: employeeDept || "未填寫",
                date: item.date || new Date().toISOString().split("T")[0],
                form: CERTIFICATE_FORMS.includes(item.form) ? item.form : "其他",
                formCustom: CERTIFICATE_FORMS.includes(item.form) ? "" : item.form,
                category: MAIN_SUBJECTS.includes(item.category) ? item.category : "其他(手動輸入)",
                categoryCustom: MAIN_SUBJECTS.includes(item.category) ? "" : item.category,
                subCategory: item.subCategory || "",
                amount: item.amount || 0,
                description: item.description || "A4多張憑證自動辨識",
                companyTitle: item.companyTitle || "",
                taxId: item.taxId || "",
                startLocation: "",
                endLocation: "",
                mileage: "",
                subsidyAmount: ""
              }));
              setRecords(prev => [...newRecords, ...prev]);
              setShowConfirmModal(false);
              triggerAlert(`✅ 成功在圖片中同步辨識出 ${parsedData.length} 張憑證！\n已全數自動加入下方明細表，請直接在表格中點選「編輯」進行最後確認。`);
            }
          } else {
            // API 連線失敗或無法精確解析時，退回基本模擬回填
            const rand = Math.random();
            let mockTitle = "茂生食品股份有限公司";
            let mockTaxId = "85099593";
            if (rand < 0.3) { mockTitle = "個人憑證"; mockTaxId = ""; }

            setCurrentRecord(prev => ({
              ...prev,
              amount: prev.amount === "" ? (Math.floor(Math.random() * 1200) + 150) : prev.amount,
              description: prev.description === "" ? "公務出差費用 (需手動校正)" : prev.description,
              companyTitle: prev.companyTitle === "" ? mockTitle : prev.companyTitle,
              taxId: prev.taxId === "" ? mockTaxId : prev.taxId
            }));
          }
        } catch (e) {
          if (e.name === 'AbortError') return;
        }
        setIsOcrLoading(false);
      };

      const cancelOcr = () => {
        if (ocrControllerRef.current) ocrControllerRef.current.abort();
        setIsOcrLoading(false);
      };

      // --- 差旅費油資補貼手動輸入模式 ---
      const startManualInput = () => {
        setCapturedImage(null);
        setInputMethod("manual");
        setIsOcrLoading(false);
        setCurrentRecord({
          date: new Date().toISOString().split("T")[0],
          form: "電子發票",
          formCustom: "",
          category: "差旅費油資補貼",
          subCategory: "",
          categoryCustom: "",
          amount: "",
          description: "",
          companyTitle: "茂生食品股份有限公司",
          taxId: "",
          startLocation: "茂生食品",
          endLocation: "",
          mileage: "",
          subsidyAmount: ""
        });
        setShowAddModal(false);
        setShowConfirmModal(true);
      };

      // --- 確認儲存主流程 ---
      const handleConfirmSave = () => {
        if (!employeeName.trim() || !employeeDept.trim()) {
          triggerAlert("請先在首頁填寫「員工姓名」與「部門」資訊！");
          return;
        }

        cancelOcr(); // 儲存時自動中斷未完成的背景辨識

        const isTicketExempt = currentRecord.form.includes("車票") || currentRecord.form === "計程車乘車證明";
        const cleanTitle = currentRecord.companyTitle.trim();
        const cleanTaxId = currentRecord.taxId.trim();

        if (!isTicketExempt) {
          const isTitleValid = cleanTitle === TARGET_COMPANY;
          const isTaxIdValid = cleanTaxId === TARGET_TAX_ID;

          if (!isTitleValid && !isTaxIdValid) {
            triggerAlert(`【憑證不合規警告】\n發票抬頭或統一編號需擇一符合，方可申報：\n\n・合規抬頭需為：「${TARGET_COMPANY}」\n・合規統編需為：「${TARGET_TAX_ID}」\n\n目前輸入不符，請重新修正。\n(若為交通車票或計程車收據，請變更憑證形式)`);
            return;
          }
        }

        if (currentRecord.category === "差旅費油資補貼") {
          if (!currentRecord.startLocation || !currentRecord.endLocation) {
            triggerAlert("「差旅費油資補貼」必須輸入起始地點與結束地點。");
            return;
          }
          if (!currentRecord.mileage || isNaN(currentRecord.mileage) || Number(currentRecord.mileage) <= 0) {
            triggerAlert("請輸入正確的實際申報里程。");
            return;
          }
        } else {
          if (!currentRecord.amount || isNaN(currentRecord.amount) || Number(currentRecord.amount) <= 0) {
            triggerAlert("請輸入大於 0 的正確金額。");
            return;
          }
        }

        const newRecord = {
          ...currentRecord,
          id: Date.now(),
          employeeName: employeeName.trim(),
          employeeDept: employeeDept.trim(),
          amount: Number(currentRecord.amount)
        };

        setRecords([newRecord, ...records]);
        setShowConfirmModal(false);
        setCapturedImage(null);
        setInputMethod("");
      };

      // --- 刪除紀錄 ---
      const handleDeleteRecord = (id) => {
        setRecords(records.filter(r => r.id !== id));
        if (editingId === id) {
          setEditingId(null);
          setEditRowData(null);
        }
      };

      // --- 行內編輯 (Inline Editing) ---
      const startInlineEdit = (record) => {
        setEditingId(record.id);
        setEditRowData({ ...record });
      };

      const handleEditFieldChange = (field, val) => {
        setEditRowData(prev => {
          const updated = { ...prev, [field]: val };
          if (updated.category === "差旅費油資補貼") {
            if (field === "startLocation" || field === "endLocation" || field === "mileage") {
              if (updated.mileage) {
                const computedCost = Math.round(Number(updated.mileage) * SUBSIDY_RATE);
                updated.subsidyAmount = computedCost;
                updated.amount = computedCost;
              }
            }
          }
          return updated;
        });
      };

      const saveInlineEdit = () => {
        if (!editRowData.employeeName.trim() || !editRowData.employeeDept.trim()) {
          triggerAlert("「姓名」與「部門」欄位不得為空！");
          return;
        }

        const isTicketExempt = editRowData.form.includes("車票") || editRowData.form === "計程車乘車證明";
        const cleanTitle = editRowData.companyTitle.trim();
        const cleanTaxId = editRowData.taxId.trim();

        if (!isTicketExempt) {
          const isTitleValid = cleanTitle === TARGET_COMPANY;
          const isTaxIdValid = cleanTaxId === TARGET_TAX_ID;
          if (!isTitleValid && !isTaxIdValid) {
            triggerAlert(`【編輯儲存失敗】\n抬頭或統編需擇一符合：\n抬頭：「${TARGET_COMPANY}」或 統編：「${TARGET_TAX_ID}」。`);
            return;
          }
        }

        if (editRowData.category === "差旅費油資補貼") {
          if (!editRowData.startLocation || !editRowData.endLocation || !editRowData.mileage || isNaN(editRowData.mileage) || Number(editRowData.mileage) <= 0) {
            triggerAlert("「差旅費油資補貼」必須有起迄地點與正確里程。");
            return;
          }
        } else {
          if (!editRowData.amount || isNaN(editRowData.amount) || Number(editRowData.amount) <= 0) {
            triggerAlert("請輸入正確大於 0 的費用金額。");
            return;
          }
        }

        setRecords(records.map(r => r.id === editingId ? { ...editRowData, amount: Number(editRowData.amount) } : r));
        setEditingId(null);
        setEditRowData(null);
      };

      const cancelInlineEdit = () => {
        setEditingId(null);
        setEditRowData(null);
      };

      // --- CSV 處理與匯出防呆邏輯 ---
      const generateCSVContent = (recordsToExport) => {
        let csvContent = "\uFEFF"; 
        csvContent += "姓名,部門,憑證日期,憑證形式,會計科目,副科目,費用金額,發票抬頭,統一編號,起始地點,結束地點,行駛里程(km),油資補貼,說明\n";
        recordsToExport.forEach(r => {
          const formText = r.form === "其他" ? r.formCustom : r.form;
          const catText = r.category === "其他(手動輸入)" ? r.categoryCustom : r.category;
          const isDrive = r.category === "差旅費油資補貼";
          csvContent += `"${r.employeeName}","${r.employeeDept}","${r.date}","${formText}","${catText}","${r.subCategory || ''}",${r.amount},"${r.companyTitle}","${r.taxId}","${isDrive ? r.startLocation : ''}","${isDrive ? r.endLocation : ''}","${isDrive ? r.mileage : ''}","${isDrive ? r.subsidyAmount : ''}","${r.description}"\n`;
        });
        return csvContent;
      };

      const handleExportClick = () => {
        if (records.length === 0) { triggerAlert("目前無明細可供匯出。"); return; }
        
        // 尋找重複項目 (依據 日期+金額+科目+統編 判斷)
        const seen = new Set();
        const dups = [];
        records.forEach(r => {
          const key = `${r.date}_${r.amount}_${r.category}_${r.taxId}`;
          if (seen.has(key)) {
            dups.push(r.id);
          } else {
            seen.add(key);
          }
        });

        if (dups.length > 0) {
          setDuplicateIds(dups);
          setShowDuplicateModal(true);
        } else {
          setShowExportModal(true);
        }
      };

      const removeDuplicatesAndExport = () => {
        const filtered = records.filter(r => !duplicateIds.includes(r.id));
        setRecords(filtered);
        setShowDuplicateModal(false);
        // 短暫延遲確保留存狀態後再顯示匯出選單
        setTimeout(() => setShowExportModal(true), 100);
      };

      const ignoreDuplicatesAndExport = () => {
        setShowDuplicateModal(false);
        setShowExportModal(true);
      };

      const handleSaveLocal = () => {
        if (records.length === 0) return;
        const csvContent = generateCSVContent(records);
        const blob = new Blob([csvContent], { type: "text/csv;charset=utf-8;" });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.setAttribute("href", url);
        link.setAttribute("download", `費用報銷彙整表_${new Date().toISOString().split("T")[0]}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        setShowExportModal(false);
      };

      const handleSystemShare = async () => {
        if (records.length === 0) return;
        const csvContent = generateCSVContent(records);
        const filename = `費用報銷彙整表_${new Date().toISOString().split("T")[0]}.csv`;
        const blob = new Blob([csvContent], { type: "text/csv;charset=utf-8;" });
        if (navigator.canShare && navigator.share) {
          try {
            const file = new File([blob], filename, { type: "text/csv" });
            if (navigator.canShare({ files: [file] })) {
              await navigator.share({ files: [file], title: "費用報銷彙整表", text: "請查收匯出之費用報銷彙整表 CSV 檔案。" });
              setShowExportModal(false);
            } else {
              handleSaveLocal();
            }
          } catch (err) {
            if (err.name !== "AbortError") handleSaveLocal();
          }
        } else {
          handleSaveLocal();
        }
      };

      // --- 寬容 CSV 匯入 ---
      const findFuzzyIndex = (header, keywords) => {
        return header.findIndex(h => {
          const clean = h.trim().toLowerCase().replace(/^\uFEFF/, '');
          return keywords.some(kw => clean.includes(kw));
        });
      };

      const handleCSVImport = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
          try {
            const arrayBuffer = event.target.result;
            const uint8Array = new Uint8Array(arrayBuffer);
            let encoding = 'utf-8';
            try {
              const utf8Decoder = new TextDecoder('utf-8', { fatal: true });
              utf8Decoder.decode(uint8Array);
            } catch (err) {
              encoding = 'big5';
            }
            const decoder = new TextDecoder(encoding);
            const text = decoder.decode(uint8Array);
            const rows = parseCSV(text);
            if (rows.length === 0) return;

            const header = rows[0];
            const hasHeader = header.some(h => isNaN(h) && h.length > 0);
            
            const nameIdx = findFuzzyIndex(header, ["姓名", "員工", "申報", "name"]);
            const deptIdx = findFuzzyIndex(header, ["部門", "單位", "課室", "dept"]);
            const dateIdx = findFuzzyIndex(header, ["憑證日期", "日期", "時間", "date"]);
            const formIdx = findFuzzyIndex(header, ["憑證形式", "形式", "種類", "type"]);
            const catIdx = findFuzzyIndex(header, ["會計科目", "科目", "category", "主選項"]);
            const subCatIdx = findFuzzyIndex(header, ["副科目", "副分類", "子選項"]);
            const amountIdx = findFuzzyIndex(header, ["費用金額", "金額", "費用", "amount"]);
            const titleIdx = findFuzzyIndex(header, ["發票抬頭", "抬頭", "買受人", "title"]);
            const taxIdx = findFuzzyIndex(header, ["統一編號", "統編", "編號", "tax"]);
            const startIdx = findFuzzyIndex(header, ["起始地點", "起點", "出發地", "start"]);
            const endIdx = findFuzzyIndex(header, ["結束地點", "迄點", "目的地", "end"]);
            const mileageIdx = findFuzzyIndex(header, ["行駛里程", "里程", "mileage"]);
            const subsidyIdx = findFuzzyIndex(header, ["油資補貼", "補貼額"]);
            const descIdx = findFuzzyIndex(header, ["說明", "備註", "事由", "desc"]);

            const importedRecords = [];
            const startRowIdx = hasHeader ? 1 : 0;

            for (let i = startRowIdx; i < rows.length; i++) {
              const row = rows[i];
              if (row.length === 0 || (row.length === 1 && row[0] === "")) continue;

              const empName = nameIdx !== -1 ? (row[nameIdx] || "") : (row[0] || employeeName || "未命名");
              const empDept = deptIdx !== -1 ? (row[deptIdx] || "") : (row[1] || employeeDept || "未填部門");
              const pDate = dateIdx !== -1 ? (row[dateIdx] || "") : (row[2] || new Date().toISOString().split("T")[0]);
              const rawForm = formIdx !== -1 ? (row[formIdx] || "") : (row[3] || "電子發票");
              const rawCat = catIdx !== -1 ? (row[catIdx] || "") : (row[4] || "交通費");
              const subCategory = subCatIdx !== -1 ? (row[subCatIdx] || "") : (row[5] || "");
              
              let amountStr = "0";
              if (amountIdx !== -1) {
                amountStr = row[amountIdx];
              } else {
                const numericCol = row.find(val => !isNaN(val) && val !== "" && Number(val) > 0);
                if (numericCol) amountStr = numericCol;
              }
              const amount = Number(amountStr) || 0;

              const companyTitle = titleIdx !== -1 ? (row[titleIdx] || "") : (row[7] || "");
              const taxId = taxIdx !== -1 ? (row[taxIdx] || "") : (row[8] || "");
              const startLocation = startIdx !== -1 ? (row[startIdx] || "") : "茂生食品";
              const endLocation = endIdx !== -1 ? (row[endIdx] || "") : "";
              const mileage = mileageIdx !== -1 ? (row[mileageIdx] || "") : "";
              const subsidyAmount = subsidyIdx !== -1 ? (row[subsidyIdx] ? Number(row[subsidyIdx]) : "") : "";
              const description = descIdx !== -1 ? (row[descIdx] || "") : (row[row.length - 1] || "");

              let form = rawForm; let formCustom = "";
              if (!CERTIFICATE_FORMS.includes(rawForm)) { form = "其他"; formCustom = rawForm; }
              let category = rawCat; let categoryCustom = "";
              if (!MAIN_SUBJECTS.includes(rawCat)) { category = "其他(手動輸入)"; categoryCustom = rawCat; }

              importedRecords.push({
                id: Date.now() + i + Math.random(),
                employeeName: empName, employeeDept: empDept, date: pDate,
                form, formCustom, category, categoryCustom, subCategory, amount,
                companyTitle, taxId, startLocation, endLocation, mileage, subsidyAmount, description
              });
            }

            if (importedRecords.length > 0) {
              // 匯入防呆：比對本機現有明細，自動剔除重複項目
              const existingKeys = new Set(records.map(r => `${r.date}_${r.amount}_${r.category}_${r.taxId}`));
              const newRecords = [];
              let duplicateCount = 0;

              importedRecords.forEach(r => {
                const key = `${r.date}_${r.amount}_${r.category}_${r.taxId}`;
                if (existingKeys.has(key)) {
                  duplicateCount++;
                } else {
                  existingKeys.add(key); // 將新項目加入 Set，同時防止匯入檔案本身內部的重複
                  newRecords.push(r);
                }
              });

              if (newRecords.length > 0) {
                setRecords(prev => [...newRecords, ...prev]);
                if (newRecords[0].employeeName) setEmployeeName(newRecords[0].employeeName);
                if (newRecords[0].employeeDept) setEmployeeDept(newRecords[0].employeeDept);
                
                let msg = `✅ 成功智慧解析並匯入 ${newRecords.length} 筆新報銷明細！`;
                if (duplicateCount > 0) {
                  msg += `\n\n⚠️ 系統比對發現有 ${duplicateCount} 筆憑證與本機現存資料重複，已自動為您剔除，防止重複報帳。`;
                }
                triggerAlert(msg);
              } else {
                if (duplicateCount > 0) {
                  triggerAlert(`⚠️ 匯入的 ${duplicateCount} 筆資料皆與本機現存明細完全重複，已全數忽略，不作匯入。`);
                } else {
                  triggerAlert("匯入檔案解析成功，但無有效明細可匯入。");
                }
              }
            }
          } catch (err) {
            triggerAlert("匯入檔案解析失敗，請確認是否為可讀取的 CSV 檔案。");
          }
        };
        reader.readAsArrayBuffer(file);
        e.target.value = "";
      };

      const triggerAlert = (msg) => {
        setAlertMessage(msg);
        setShowAlertModal(true);
      };

      const isTicketRelated = currentRecord.form.includes("車票") || currentRecord.form === "計程車乘車證明";

      return (
        <div class="max-w-4xl mx-auto p-4 md:p-6 pb-24">
          
          <header class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-6 bg-slate-900 text-white p-5 rounded-2xl shadow-lg">
            <div>
              <span class="text-xs bg-indigo-600 text-indigo-100 font-semibold px-2.5 py-1 rounded-full uppercase tracking-wider">
                茂生食品股份有限公司
              </span>
              <h1 class="text-2xl font-bold mt-2">費用報銷彙整表</h1>
              <p class="text-slate-400 text-xs mt-1">全體員工通用・支援 A4 多憑證同時辨識與防重複匯出</p>
            </div>
            <div class="mt-4 sm:mt-0">
              <span class="bg-slate-800 text-slate-300 px-3 py-1.5 rounded-lg text-sm border border-slate-700 font-mono">
                系統版本：{VERSION}
              </span>
            </div>
          </header>

          <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 mb-6">
            <h3 class="text-sm font-bold text-slate-800 mb-3 flex items-center">
              <span class="mr-1.5">👤</span> 申報人基本資訊
            </h3>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
              <div>
                <label class="block text-xs font-semibold text-slate-500 mb-1">員工姓名 <span class="text-rose-500">*</span></label>
                <input type="text" placeholder="請輸入姓名" value={employeeName} onChange={(e) => setEmployeeName(e.target.value)} class="w-full bg-slate-50 border border-slate-200 focus:border-indigo-500 rounded-xl px-3 py-2 text-sm outline-none" />
              </div>
              <div>
                <label class="block text-xs font-semibold text-slate-500 mb-1">申報部門 <span class="text-rose-500">*</span></label>
                <input type="text" placeholder="請輸入部門" value={employeeDept} onChange={(e) => setEmployeeDept(e.target.value)} class="w-full bg-slate-50 border border-slate-200 focus:border-indigo-500 rounded-xl px-3 py-2 text-sm outline-none" />
              </div>
            </div>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 flex flex-col justify-between">
              <span class="text-slate-500 text-sm font-medium">申報總累計金額</span>

                        {(!currentRecord.form.includes("車票") && currentRecord.form !== "計程車乘車證明") ? (
                          <div class="border rounded-2xl p-4 bg-slate-50/50 space-y-3.5">
                            <span class="block text-xs font-bold text-slate-700">📋 憑證核驗 (抬頭或統編擇一)</span>
                            <input type="text" placeholder="抬頭" value={currentRecord.companyTitle} onChange={(e) => setCurrentRecord({ ...currentRecord, companyTitle: e.target.value })} class="w-full bg-white border rounded-xl px-3 py-2 text-sm" />
                            <input type="text" placeholder="統編" value={currentRecord.taxId} onChange={(e) => setCurrentRecord({ ...currentRecord, taxId: e.target.value })} class="w-full bg-white border rounded-xl px-3 py-2 text-sm font-mono" />
                          </div>
                        ) : <div class="bg-emerald-50 text-xs text-emerald-800 p-4 rounded-2xl">🎫 車票類免核對統編抬頭</div>}
                      </div>
                    </div>
                  ) : (
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                      <div>
                        <span class="block text-xs font-bold text-slate-500 mb-2 uppercase">憑證預覽</span>
                        {capturedImage ? (
                          <div class="rounded-xl border bg-slate-50 aspect-[3/4] flex items-center relative"><img src={capturedImage} class="w-full h-full object-contain" /></div>
                        ) : (
                          <div class="rounded-xl border-2 border-dashed bg-slate-50 aspect-[3/4] flex items-center justify-center"><span class="text-xs text-slate-400">無影像</span></div>
                        )}
                      </div>
                      <div class="space-y-4">
                        <div>
                          <label class="block text-xs font-bold text-slate-500 mb-1.5">報銷科目</label>
                          <select value={currentRecord.category} onChange={(e) => setCurrentRecord({ ...currentRecord, category: e.target.value, subCategory: e.target.value === "交通費" ? "大眾運輸" : "" })} class="w-full bg-slate-50 border rounded-xl px-3 py-2.5 text-sm font-semibold">
                            {MAIN_SUBJECTS.map(s => <option key={s} value={s}>{s}</option>)}
                          </select>
                        </div>
                        {currentRecord.category === "交通費" && (
                          <div>
                            <label class="block text-xs font-bold text-indigo-700 mb-1.5">➔ 交通副選項</label>
                            <select value={currentRecord.subCategory} onChange={(e) => setCurrentRecord({ ...currentRecord, subCategory: e.target.value })} class="w-full bg-indigo-50 border-indigo-200 rounded-xl px-3 py-2.5 text-sm font-semibold">
                              {TRAFFIC_SUB_SUBJECTS.map(sub => <option key={sub} value={sub}>{sub}</option>)}
                            </select>
                          </div>
                        )}
                        <div>
                          <label class="block text-xs font-bold text-slate-500 mb-1.5">憑證日期</label>
                          <input type="date" value={currentRecord.date} onChange={(e) => setCurrentRecord({ ...currentRecord, date: e.target.value })} class="w-full bg-slate-50 border rounded-xl px-3 py-2.5 text-sm" />
                        </div>
                        <div>
                          <label class="block text-xs font-bold text-slate-500 mb-1.5">憑證形式</label>
                          <select value={currentRecord.form} onChange={(e) => setCurrentRecord({ ...currentRecord, form: e.target.value })} class="w-full bg-slate-50 border rounded-xl px-3 py-2.5 text-sm">
                            {CERTIFICATE_FORMS.map(f => <option key={f} value={f}>{f}</option>)}
                          </select>
                        </div>
                        {(!currentRecord.form.includes("車票") && currentRecord.form !== "計程車乘車證明") && (
                          <div class="border rounded-2xl p-4 bg-slate-50/50 space-y-3.5">
                            <span class="block text-xs font-bold text-slate-700">📋 憑證核驗 (擇一必填)</span>
                            <input type="text" placeholder="抬頭" value={currentRecord.companyTitle} onChange={(e) => setCurrentRecord({ ...currentRecord, companyTitle: e.target.value })} class="w-full bg-white border rounded-xl px-3 py-2 text-sm" />
                            <input type="text" placeholder="統編" value={currentRecord.taxId} onChange={(e) => setCurrentRecord({ ...currentRecord, taxId: e.target.value })} class="w-full bg-white border rounded-xl px-3 py-2 text-sm font-mono" />
                          </div>
                        )}
                        <div>
                          <label class="block text-xs font-bold text-slate-500 mb-1.5">費用金額 (NT$)</label>
                          <input type="number" value={currentRecord.amount} onChange={(e) => setCurrentRecord({ ...currentRecord, amount: e.target.value })} class="w-full bg-slate-50 border rounded-xl px-3 py-2.5 text-sm font-bold text-indigo-600" />
                        </div>
                        <div>
                          <label class="block text-xs font-bold text-slate-500 mb-1">申報說明</label>
                          <textarea rows="2" value={currentRecord.description} onChange={(e) => setCurrentRecord({ ...currentRecord, description: e.target.value })} placeholder="差旅原因、特殊狀況" class="w-full bg-slate-50 border rounded-xl px-3 py-2.5 text-sm" />
                        </div>
                      </div>
                    </div>
                  )}
                </div>
                <div class="bg-slate-50 p-5 border-t flex space-x-3">
                  <button onClick={() => { cancelOcr(); setShowConfirmModal(false); }} class="flex-1 bg-white border py-3 rounded-xl font-semibold text-sm">取消</button>
                  <button onClick={handleConfirmSave} class="flex-1 bg-slate-900 text-white py-3 rounded-xl font-semibold text-sm shadow">確認無誤，彙整儲存</button>
                </div>
              </div>
            </div>
          )}

          {/* --- 視窗 3：匯出防重複警告框 --- */}
          {showDuplicateModal && (
            <div class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div class="bg-white rounded-3xl w-full max-w-md p-6 shadow-2xl text-center animate-in fade-in zoom-in-95 duration-200">
                <div class="flex justify-center mb-4"><span class="text-5xl">⚠️</span></div>
                <h3 class="text-xl font-bold text-amber-600 mb-2">發現疑似重複憑證</h3>
                <div class="text-sm text-slate-600 text-left bg-amber-50 p-4 rounded-xl mb-6">
                  系統比對發現有 <strong>{duplicateIds.length}</strong> 筆憑證的「日期、金額、科目與統編」完全相同，疑似重複登錄。<br/><br/>請問您要自動刪除這些重複的項目，還是保留全部資料並繼續匯出？
                </div>
                <div class="space-y-3">
                  <button onClick={removeDuplicatesAndExport} class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-4 rounded-xl shadow transition-colors">
                    🗑️ 自動刪除重複並匯出
                  </button>
                  <button onClick={ignoreDuplicatesAndExport} class="w-full bg-slate-200 hover:bg-slate-300 text-slate-800 font-bold py-3 px-4 rounded-xl transition-colors">
                    保留全部並繼續匯出
                  </button>
                  <button onClick={() => setShowDuplicateModal(false)} class="w-full bg-white hover:bg-slate-50 text-slate-500 py-3 rounded-xl border border-slate-200 transition-colors">
                    取消匯出
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* --- 視窗 4：匯出 --- */}
          {showExportModal && (
            <div class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div class="bg-white rounded-3xl w-full max-w-sm p-6 shadow-2xl text-center animate-in fade-in zoom-in-95 duration-200">
                <div class="flex justify-end"><button onClick={() => setShowExportModal(false)} class="text-slate-400 p-1 hover:text-slate-600">✕</button></div>
                <div class="w-16 h-16 bg-emerald-50 text-emerald-600 rounded-full flex items-center justify-center mx-auto mb-4"><IconDownload /></div>
                <h3 class="text-lg font-bold text-slate-900 mb-2">匯出選項</h3>
                <div class="space-y-3 mt-6">
                  <button onClick={handleSaveLocal} class="w-full bg-indigo-600 text-white font-bold py-3 px-4 rounded-xl shadow">⬇️ 儲存至本機</button>
                  <button onClick={handleSystemShare} class="w-full bg-slate-900 text-white font-bold py-3 px-4 rounded-xl shadow flex items-center justify-center space-x-2"><IconShare /><span>📤 傳送/分享</span></button>
                </div>
              </div>
            </div>
          )}

          {/* --- 視窗 5：通用警告框 --- */}
          {showAlertModal && (
            <div class="fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div class="bg-white rounded-3xl w-full max-w-sm p-6 shadow-2xl text-center">
                <div class="flex justify-center mb-4"><IconAlert /></div>
                <h3 class="text-lg font-bold text-rose-600 mb-2">系統提示</h3>
                <div class="text-sm text-slate-600 text-left bg-rose-50 p-4 rounded-xl mb-5 whitespace-pre-wrap">{alertMessage}</div>
                <button onClick={() => setShowAlertModal(false)} class="w-full bg-slate-900 text-white font-bold py-3 rounded-xl">確認</button>
              </div>
            </div>
          )}

        </div>
      );
    }

    const rootElement = document.getElementById("root");
    const root = ReactDOM.createRoot(rootElement);
    root.render(<App />);
  </script>
</body>
</html>
